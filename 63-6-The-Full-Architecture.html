<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How Much Can OHS Spend?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Open+Sans:wght@400;600;700;800&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <style>
    /* Page-scoped Module-6 OHS palette + layout, matching the 62-1 / 65-x walk-page idiom. */
    .m6ohs-scope {
      --m6ohs-paper:#ffffff;
      --m6ohs-panel:#f8fafc;
      --m6ohs-ink:#263746;
      --m6ohs-muted:#657583;
      --m6ohs-primary:#155b86;
      --m6ohs-rule:#c8d4dc;
      --m6ohs-rule-strong:#708592;
      --m6ohs-warm:#fff8df;
      --m6ohs-accent:#d5a528;
      --m6ohs-success:#167447;
      --m6ohs-soft:#f3f8fb;
      --m6ohs-shadow:rgba(32,55,72,0.09);
    }
    .m6ohs-doc-wrap, .m6ohs-architecture-wrap { min-width:0; overflow-x:auto; padding:2px 2px 8px; }
    .m6ohs-doc-card, .m6ohs-question-card, .m6ohs-snapshot, .m6ohs-mini-panel {
      box-sizing:border-box;
      border:1px solid var(--m6ohs-rule);
      border-radius:12px;
      background:var(--m6ohs-paper);
      color:var(--m6ohs-ink);
      box-shadow:0 8px 24px var(--m6ohs-shadow);
    }
    .m6ohs-kicker { margin:0 0 5px; color:var(--m6ohs-muted); font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
    .m6ohs-doc-title { margin:0; color:var(--m6ohs-primary); font-size:20px; }
    .m6ohs-subline { margin:3px 0 0; color:var(--m6ohs-muted); font-size:12px; font-style:italic; }
    .m6ohs-value { text-align:right; white-space:nowrap; font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums; }
    .m6ohs-question-card { max-width:760px; margin:0 auto; padding:26px; border:2px dashed var(--m6ohs-accent); background:var(--m6ohs-warm); }
    .m6ohs-question-card h2 { margin:3px 0 16px; color:var(--m6ohs-primary); font-size:23px; text-align:center; }
    .m6ohs-question-card > .m6ohs-kicker { text-align:center; }
    .m6ohs-q-table { margin:0 auto; font:11.5px/1.45 "JetBrains Mono",monospace; }
    .m6ohs-q-row { display:grid; grid-template-columns:minmax(260px,1fr) 7rem; gap:12px; align-items:baseline; padding:6px 4px; }
    .m6ohs-q-row + .m6ohs-q-row { border-top:1px solid var(--m6ohs-rule); }
    .m6ohs-q-key { color:var(--m6ohs-primary); font-weight:800; }
    .m6ohs-q-notes { margin:16px 0 0; padding-top:12px; border-top:1px solid var(--m6ohs-rule-strong); }
    .m6ohs-q-notes p { margin:4px 0; color:var(--m6ohs-ink); font-size:12px; font-style:italic; line-height:1.5; }
    .m6ohs-q-footer { margin:14px 0 0; color:var(--m6ohs-primary); font-size:12px; font-weight:800; text-align:center; }
    .m6ohs-doc-card { max-width:820px; min-width:560px; margin:0 auto; padding:24px; }
    .m6ohs-liq-table { margin-top:16px; font-size:11.5px; }
    .m6ohs-liq-row { display:grid; grid-template-columns:minmax(280px,1fr) 7rem; column-gap:10px; align-items:baseline; padding:3px 5px; }
    .m6ohs-liq-head { margin-top:10px; color:var(--m6ohs-primary); font-size:12px; font-weight:800; }
    .m6ohs-liq-sub { padding:0 5px 3px 18px; color:var(--m6ohs-muted); font-size:10px; font-style:italic; }
    .m6ohs-liq-subtotal { margin-top:2px; padding-top:6px; border-top:1px solid var(--m6ohs-rule-strong); font-weight:700; }
    .m6ohs-move { opacity:0; transform:translateY(4px); }
    .m6ohs-move.m6ohs-visible { opacity:1; transform:none; transition:opacity .3s ease-out,transform .3s ease-out; }
    .m6ohs-running { margin-top:9px; padding-top:8px; border-top:2px dashed var(--m6ohs-accent); color:var(--m6ohs-primary); font-weight:800; }
    .m6ohs-running > div:first-child { color:var(--m6ohs-accent); font-style:italic; }
    .m6ohs-target { margin-top:4px; color:var(--m6ohs-muted); font-size:11px; font-style:italic; }
    .m6ohs-scale-card { max-width:680px; }
    .m6ohs-scale-table { margin-top:14px; font:11.5px/1.45 "JetBrains Mono",monospace; }
    .m6ohs-scale-row { display:grid; grid-template-columns:minmax(280px,1fr) 7rem; gap:12px; align-items:baseline; padding:6px 4px; }
    .m6ohs-scale-row + .m6ohs-scale-row { border-top:1px solid var(--m6ohs-rule); }
    .m6ohs-scale-key { color:var(--m6ohs-primary); font-weight:800; }
    .m6ohs-bar-wrap { margin:18px 0 4px; }
    .m6ohs-bar-track { position:relative; display:grid; grid-template-columns:repeat(12,1fr); height:26px; border:1px solid var(--m6ohs-rule-strong); border-radius:5px; overflow:hidden; background:var(--m6ohs-panel); }
    .m6ohs-bar-cell { border-right:1px solid var(--m6ohs-rule); }
    .m6ohs-bar-cell:last-child { border-right:0; }
    .m6ohs-bar-fill { position:absolute; top:0; left:0; bottom:0; background:var(--m6ohs-accent); opacity:.55; }
    .m6ohs-bar-caption { margin:7px 0 0; color:var(--m6ohs-muted); font-size:10.5px; font-style:italic; display:flex; justify-content:space-between; gap:12px; }
    .m6ohs-bar-months { color:var(--m6ohs-primary); font-weight:800; font-style:normal; }
    .m6ohs-endow-card { max-width:860px; min-width:640px; }
    .m6ohs-endow-grid { margin-top:16px; font-size:10.5px; }
    .m6ohs-endow-row { display:grid; grid-template-columns:minmax(185px,1fr) repeat(4,6rem); column-gap:8px; align-items:baseline; padding:4px 5px; }
    .m6ohs-endow-head { padding-bottom:7px; border-bottom:1px solid var(--m6ohs-rule); color:var(--m6ohs-primary); font-size:9.5px; font-weight:700; line-height:1.25; }
    .m6ohs-endow-head .m6ohs-value { white-space:normal; font-family:Inter,"Open Sans",sans-serif; }
    .m6ohs-endow-open { color:var(--m6ohs-primary); font-weight:800; }
    .m6ohs-endow-end { margin-top:4px; padding-top:7px; border-top:3px double var(--m6ohs-rule-strong); color:var(--m6ohs-primary); font-weight:800; }
    .m6ohs-walkline { margin:13px 0 0; padding-top:9px; border-top:1px solid var(--m6ohs-rule); color:var(--m6ohs-primary); font:700 11px/1.5 "JetBrains Mono",monospace; }
    .m6ohs-tie-note { margin:8px 0 0; color:var(--m6ohs-muted); font-size:10.5px; font-style:italic; line-height:1.5; }
    .m6ohs-architecture { display:grid; grid-template-columns:minmax(250px,.9fr) minmax(400px,1.5fr) minmax(250px,.9fr); gap:14px; align-items:start; min-width:960px; }
    .m6ohs-architecture > * { min-width:0; }
    .m6ohs-snapshot { min-width:245px; padding:17px; }
    .m6ohs-snapshot-title { margin:0; color:var(--m6ohs-primary); font-size:16px; line-height:1.25; }
    .m6ohs-snapshot-table { margin-top:13px; font-size:11px; }
    .m6ohs-compact-row { display:grid; grid-template-columns:minmax(115px,1fr) 5.4rem; column-gap:7px; align-items:baseline; padding:3px 0; }
    .m6ohs-compact-total { margin-top:3px; padding-top:5px; border-top:1px solid var(--m6ohs-rule-strong); color:var(--m6ohs-primary); font-weight:800; }
    .m6ohs-compact-gap { height:8px; }
    .m6ohs-compact-indent { display:grid; grid-template-columns:minmax(115px,1fr) 5.4rem; column-gap:7px; padding:1px 0 1px 10px; color:var(--m6ohs-muted); font-size:9.5px; font-style:italic; }
    .m6ohs-netbox { margin-top:5px; padding:7px 7px 5px; border-left:2px solid var(--m6ohs-accent); border-radius:3px; background:var(--m6ohs-soft); }
    .m6ohs-identity { margin:9px 0 0; color:var(--m6ohs-muted); font-family:"JetBrains Mono",monospace; font-size:9.5px; font-style:italic; text-align:center; }
    .m6ohs-center-stack { display:grid; gap:10px; }
    .m6ohs-mini-panel { overflow-x:auto; padding:13px 14px; border-radius:10px; box-shadow:0 5px 16px var(--m6ohs-shadow); }
    .m6ohs-mini-title { margin:0; color:var(--m6ohs-primary); font-size:11px; font-weight:800; letter-spacing:.07em; text-transform:uppercase; }
    .m6ohs-mini-subline { margin:3px 0 8px; color:var(--m6ohs-muted); font-size:10px; font-style:italic; line-height:1.4; }
    .m6ohs-mini-row { display:grid; grid-template-columns:minmax(200px,1fr) 6.2rem; gap:7px; align-items:baseline; padding:2px 0; font-size:10.5px; }
    .m6ohs-mini-total { margin-top:3px; padding-top:4px; border-top:1px solid var(--m6ohs-rule-strong); color:var(--m6ohs-primary); font-weight:800; }
    .m6ohs-mini-note { margin:6px 0 0; color:var(--m6ohs-muted); font-size:9.5px; font-style:italic; line-height:1.45; }
    .m6ohs-cash-bridge { margin-top:5px; padding-top:4px; border-top:1px solid var(--m6ohs-rule); }
    .m6ohs-bucket-grid { display:grid; grid-template-columns:minmax(160px,1fr) repeat(3,5.6rem); gap:4px 6px; align-items:baseline; min-width:400px; font-size:10px; }
    .m6ohs-bucket-head { color:var(--m6ohs-muted); font-size:9px; font-weight:700; text-align:right; }
    .m6ohs-bucket-opening { color:var(--m6ohs-primary); font-weight:700; }
    .m6ohs-bucket-reclass { color:var(--m6ohs-muted); font-size:9.5px; font-style:italic; }
    .m6ohs-bucket-closing { margin-top:4px; padding-top:5px; border-top:1px solid var(--m6ohs-rule-strong); color:var(--m6ohs-primary); font-weight:800; }
    .m6ohs-insight-wrap { margin-top:18px; }
    @media (max-width:900px) { .m6ohs-architecture { min-width:900px; } }
    @media (max-width:620px) {
      .m6ohs-doc-card { min-width:0; }
      .m6ohs-liq-row, .m6ohs-q-row, .m6ohs-scale-row { grid-template-columns:1fr; gap:2px; }
      .m6ohs-liq-row .m6ohs-value, .m6ohs-q-row .m6ohs-value, .m6ohs-scale-row .m6ohs-value { text-align:left; }
      .m6ohs-endow-card { min-width:0; }
      .m6ohs-endow-row { grid-template-columns:minmax(150px,1fr) repeat(4,5.2rem); }
    }
    @media (prefers-reduced-motion:reduce) { .m6ohs-move.m6ohs-visible { transition:none; } }
    @media (prefers-color-scheme:dark) {
      .m6ohs-scope {
        --m6ohs-paper:#26242e;
        --m6ohs-panel:#211f28;
        --m6ohs-ink:#e8edf1;
        --m6ohs-muted:#b4c0c8;
        --m6ohs-primary:#7dc8f3;
        --m6ohs-rule:#4b5361;
        --m6ohs-rule-strong:#8797a2;
        --m6ohs-warm:#332f20;
        --m6ohs-accent:#d8ad3e;
        --m6ohs-success:#70d6a3;
        --m6ohs-soft:#25313a;
        --m6ohs-shadow:rgba(0,0,0,0.28);
      }
    }
  </style>
</head>
<body>
<div class="page">
  <div class="prework-wrap">
    <div class="tut-header">
      <div class="tut-header-main">
        <h1>How Much Can OHS Spend?</h1>
        <p class="tut-header-sub">Module 6 &middot; ~7 min</p>
      </div>
      <div class="tut-header-actions">
        <button class="icon-btn" title="Glossary" aria-label="Open glossary" onclick="openGlossary()"><i data-lucide="book-open"></i></button>
        <button class="icon-btn" title="Reset this phase" aria-label="Reset this phase" onclick="restart()"><i data-lucide="rotate-ccw"></i></button>
      </div>
    </div>
    <div class="phase-title" id="phaseTitle">How Much Can OHS Spend?</div>
    <div id="beats"></div>
    <div id="mainGrid"></div>
    <div id="tail"></div>
    <div id="controls"></div>
  </div>
</div>

<div class="glossary-overlay" id="glossaryOverlay" onclick="if(event.target===this) closeGlossary()">
  <div class="glossary-panel">
    <div class="glossary-panel-head">
      <div class="glossary-panel-title"><i data-lucide="book-open" class="licon"></i> Glossary</div>
      <button class="glossary-close-btn" aria-label="Close" onclick="closeGlossary()">&times;</button>
    </div>
    <div class="glossary-list" id="glossaryList"></div>
  </div>
</div>

<script src="ohs-fy2025-data.js"></script>
<script src="shared.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<script>
if(window.lucide) lucide.createIcons();

var audioCtx=null;
function ac(){ if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return audioCtx; }
function tone(f,d,t,v){ var c=ac(); if(!c) return; var o=c.createOscillator(),g=c.createGain(); o.type=t||'sine'; o.frequency.value=f; o.connect(g); g.connect(c.destination); g.gain.setValueAtTime(v||0.05,c.currentTime); g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+d); o.start(); o.stop(c.currentTime+d); }
function playSuccess(){ tone(523,0.12); setTimeout(function(){tone(659,0.12);},90); setTimeout(function(){tone(784,0.16);},180); }
function playClick(){ tone(600,0.08,'sine',0.04); }
function nav(url){ playClick(); window.location.href=url; }

var step=0;
var TOTAL_STEPS=6;
var revealN=0;
var revealVisited=false;
var revealTimer=null;

function escapeHTML(value){ return String(value).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function fmt(v){ if(v===0) return '&mdash;'; var a=Math.abs(v).toLocaleString('en-US'); return v<0?'('+a+')':a; }
function plain(v){ return Math.abs(v).toLocaleString('en-US'); }
function D(){ return window.OHS_FY2025; }
function liq(){ return D().notes.liquidity; }
function liqRow(list,id){ for(var i=0;i<list.length;i++) if(list[i].id===id) return list[i]; return null; }

/* ---------- Step 0: the question card ---------- */
function questionCard(){
  var s=D().sfp;
  var rows='';
  s.netAssetsWithout.forEach(function(r){ rows+='<div class="m6ohs-q-row"><div>'+escapeHTML(r.label)+'</div><div class="m6ohs-value">'+fmt(r.y2025)+'</div></div>'; });
  rows+='<div class="m6ohs-q-row"><div>With donor restrictions</div><div class="m6ohs-value">'+fmt(s.withRestrictions.y2025)+'</div></div>';
  rows+='<div class="m6ohs-q-row m6ohs-q-key"><div>Total net assets, December 31, 2025</div><div class="m6ohs-value">'+fmt(s.totalNetAssets.y2025)+'</div></div>';
  return '<div class="m6ohs-scope"><div class="m6ohs-question-card"><p class="m6ohs-kicker">The reader&rsquo;s last question</p>'
    +'<h2>'+plain(s.totalNetAssets.y2025)+' of net assets &mdash; can OHS spend it?</h2>'
    +'<div class="m6ohs-q-table">'+rows+'</div>'
    +'<div class="m6ohs-q-notes"><p>Net assets is a computed difference &mdash; total assets minus total liabilities. A classification, not a bank balance.</p>'
    +'<p>Most of the total is buildings and fenced investments. The spending question gets a note of its own.</p></div>'
    +'<p class="m6ohs-q-footer">Note 4 &mdash; the liquidity note &mdash; is next.</p></div></div>';
}

/* ---------- Step 1: the liquidity note, walked row by row ---------- */
function liqSequence(){
  var L=liq(),seq=[];
  seq.push({type:'head',label:'Financial assets at December 31, 2025'});
  L.available.forEach(function(r){ seq.push({type:'row',label:r.label,v:r.y2025}); });
  seq.push({type:'subtotal',label:'Total financial assets',display:L.totalAvailable.y2025});
  seq.push({type:'head',label:'Less &mdash; the board&rsquo;s own fence (Note 18)'});
  seq.push({type:'row',label:liqRow(L.unavailable,'quasi').label,v:liqRow(L.unavailable,'quasi').y2025,note:'a choice &mdash; the board could choose otherwise'});
  seq.push({type:'head',label:'Less &mdash; donors&rsquo; fences'});
  seq.push({type:'row',label:liqRow(L.unavailable,'donorEndowment').label,v:liqRow(L.unavailable,'donorEndowment').y2025});
  seq.push({type:'row',label:liqRow(L.unavailable,'annuityInvestments').label,v:liqRow(L.unavailable,'annuityInvestments').y2025});
  seq.push({type:'row',label:liqRow(L.unavailable,'luluMadison').label,v:liqRow(L.unavailable,'luluMadison').y2025,note:'released in full during 2025 &mdash; the promise finished'});
  seq.push({type:'head',label:'Add back &mdash; approved for next year&rsquo;s spending'});
  L.appropriations.forEach(function(r){ seq.push({type:'row',label:r.label,v:r.y2025}); });
  return seq;
}
function liqAmountCount(){ var n=0; liqSequence().forEach(function(e){ if(e.type==='row') n++; }); return n; }
function liquidityWalk(){
  var L=liq(),seq=liqSequence(),acc=0,shownAmounts=0;
  var h='<div class="m6ohs-scope"><div class="m6ohs-doc-wrap"><div class="m6ohs-doc-card">'
    +'<p class="m6ohs-kicker">Oregon Humane Society &middot; from the notes &middot; Note 4</p>'
    +'<h2 class="m6ohs-doc-title">Availability of Financial Assets</h2>'
    +'<p class="m6ohs-subline">December 31, 2025 &middot; exact dollars &middot; the pile, fenced</p>'
    +'<div class="m6ohs-liq-table">';
  for(var i=0;i<seq.length;i++){
    var e=seq[i],vis=i<revealN?' m6ohs-visible':'',mv=' m6ohs-move';
    if(e.type==='head'){ h+='<div class="m6ohs-liq-row m6ohs-liq-head'+mv+vis+'"><div>'+e.label+'</div><div></div></div>'; }
    else if(e.type==='subtotal'){ h+='<div class="m6ohs-liq-row m6ohs-liq-subtotal'+mv+vis+'"><div>'+e.label+'</div><div class="m6ohs-value">'+fmt(e.display)+'</div></div>'; }
    else {
      if(i<revealN){ acc+=e.v; shownAmounts++; }
      h+='<div class="m6ohs-liq-row'+mv+vis+'"><div>'+e.label+'</div><div class="m6ohs-value">'+fmt(e.v)+'</div></div>';
      if(e.note) h+='<div class="m6ohs-liq-sub'+mv+vis+'">'+e.note+'</div>';
    }
  }
  h+='<div class="m6ohs-liq-row m6ohs-running"><div>Running total ('+shownAmounts+' of '+liqAmountCount()+' amounts)</div><div class="m6ohs-value">'+fmt(acc)+'</div></div>';
  h+='<div class="m6ohs-liq-row m6ohs-target"><div>Target: financial assets available within one year for general expenditure</div><div class="m6ohs-value">'+fmt(L.availableWithinOneYear.y2025)+'</div></div>';
  return h+'</div></div></div></div>';
}

/* ---------- Step 2: scale it ---------- */
function monthsOfExpenses(){ return liq().availableWithinOneYear.y2025 / D().functional.totalsRow.t2025 * 12; }
function scaleCard(){
  var L=liq(),exp=D().functional.totalsRow.t2025;
  var pct=(L.availableWithinOneYear.y2025/exp*100);
  var cells=''; for(var i=0;i<12;i++) cells+='<div class="m6ohs-bar-cell"></div>';
  return '<div class="m6ohs-scope"><div class="m6ohs-doc-wrap"><div class="m6ohs-doc-card m6ohs-scale-card">'
    +'<p class="m6ohs-kicker">Scale it</p>'
    +'<h2 class="m6ohs-doc-title">Five months of ready money</h2>'
    +'<p class="m6ohs-subline">the note&rsquo;s bottom line, against one year of operating expenses</p>'
    +'<div class="m6ohs-scale-table">'
    +'<div class="m6ohs-scale-row m6ohs-scale-key"><div>Financial assets available within one year (Note 4)</div><div class="m6ohs-value">'+fmt(L.availableWithinOneYear.y2025)+'</div></div>'
    +'<div class="m6ohs-scale-row"><div>Operating expenses, year ended December 31, 2025</div><div class="m6ohs-value">'+fmt(exp)+'</div></div>'
    +'</div>'
    +'<div class="m6ohs-bar-wrap"><div class="m6ohs-bar-track">'+cells+'<div class="m6ohs-bar-fill" style="width:'+pct.toFixed(2)+'%"></div></div>'
    +'<p class="m6ohs-bar-caption"><span>each cell = one month of FY2025 operating expenses</span><span class="m6ohs-bar-months">&asymp; '+Math.round(monthsOfExpenses())+' months</span></p></div>'
    +'</div></div></div>';
}

/* ---------- Step 3: the endowment's own walk (Note 19) ---------- */
function endowTable(){
  var E=D().notes.endowment,Y=E.y2025;
  var rowDefs=[
    {key:'begin',label:'Endowment net assets, beginning of year',cls:'m6ohs-endow-open'},
    {key:'contributions',label:'Contributions',cls:''},
    {key:'boardDesignation',label:'Board designation',cls:''},
    {key:'netReturn',label:'Net investment return',cls:''},
    {key:'appropriation',label:'Appropriation for expenditure',cls:''},
    {key:'end',label:'Endowment net assets, end of year',cls:'m6ohs-endow-end'}
  ];
  var h='<div class="m6ohs-scope"><div class="m6ohs-doc-wrap"><div class="m6ohs-doc-card m6ohs-endow-card">'
    +'<p class="m6ohs-kicker">Oregon Humane Society &middot; from the notes &middot; Note 19</p>'
    +'<h2 class="m6ohs-doc-title">Changes in Endowment Net Assets</h2>'
    +'<p class="m6ohs-subline">year ended December 31, 2025 &middot; exact dollars &middot; a walk table, printed by the auditors</p>'
    +'<div class="m6ohs-endow-grid"><div class="m6ohs-endow-row m6ohs-endow-head"><div></div>';
  E.columns.forEach(function(c){ h+='<div class="m6ohs-value">'+escapeHTML(c)+'</div>'; });
  h+='</div>';
  rowDefs.forEach(function(r){
    var d=Y[r.key];
    h+='<div class="m6ohs-endow-row'+(r.cls?' '+r.cls:'')+'"><div>'+r.label+'</div>'
      +'<div class="m6ohs-value">'+fmt(d.quasi)+'</div><div class="m6ohs-value">'+fmt(d.accumReturn)+'</div><div class="m6ohs-value">'+fmt(d.principal)+'</div><div class="m6ohs-value">'+fmt(d.total)+'</div></div>';
  });
  h+='</div><p class="m6ohs-walkline">'+plain(Y.begin.total)+' + '+plain(Y.contributions.total)+' + '+plain(Y.boardDesignation.total)+' + '+plain(Y.netReturn.total)+' &minus; '+plain(Math.abs(Y.appropriation.total))+' = '+plain(Y.end.total)+' &#10003; &mdash; the endowment&rsquo;s own walk</p>';
  h+='<p class="m6ohs-tie-note">The Quasi-endowment column ends at '+plain(Y.end.quasi)+' &mdash; the balance sheet&rsquo;s Board-designated endowment row, and the board&rsquo;s fence from Note 4. The other two columns end at '+plain(Y.end.accumReturn)+' + '+plain(Y.end.principal)+' = '+plain(Y.end.accumReturn+Y.end.principal)+' &mdash; the donors&rsquo; endowment fence. The two fences you just subtracted are one endowment, walked. Each column is an account, and each column walks.</p>';
  return h+'</div></div></div>';
}

/* ---------- Steps 4-5: the full architecture ---------- */
function compactRow(label,value,className){
  return '<div class="m6ohs-compact-row'+(className?' '+className:'')+'"><div>'+label+'</div><div class="m6ohs-value">'+fmt(value)+'</div></div>';
}
function compactSnapshot(year,kicker,dateText){
  var s=D().sfp;
  var totalAssets=s.totalAssets[year],cash=null;
  s.assets.forEach(function(r){ if(r.id==='cash') cash=r[year]; });
  var investments=null;
  s.assets.forEach(function(r){ if(r.id==='investments') investments=r[year]; });
  var rows=compactRow('Cash and cash equivalents',cash,'');
  rows+=compactRow('Noncash assets',totalAssets-cash,'');
  rows+='<div class="m6ohs-compact-indent"><div>(including investments of '+fmt(investments)+')</div><div></div></div>';
  rows+=compactRow('Total assets',totalAssets,'m6ohs-compact-total');
  rows+='<div class="m6ohs-compact-gap"></div>';
  rows+=compactRow('&minus; Total liabilities',s.totalLiabilities[year],'');
  rows+='<div class="m6ohs-netbox">';
  s.netAssetsWithout.forEach(function(r){ rows+=compactRow(escapeHTML(r.label),r[year],''); });
  rows+=compactRow('Total without donor restrictions',s.totalWithout[year],'m6ohs-compact-total');
  rows+=compactRow('+ With donor restrictions',s.withRestrictions[year],'');
  rows+=compactRow('= Total net assets',s.totalNetAssets[year],'m6ohs-compact-total');
  rows+='</div>';
  rows+='<p class="m6ohs-identity">'+fmt(totalAssets)+' &minus; '+fmt(s.totalLiabilities[year])+' = '+fmt(s.totalNetAssets[year])+' &#10003;</p>';
  return '<div><div class="m6ohs-snapshot"><p class="m6ohs-kicker">'+kicker+'</p>'
    +'<h3 class="m6ohs-snapshot-title">Statement of Financial Position</h3>'
    +'<p class="m6ohs-subline">'+dateText+' &middot; exact dollars</p>'
    +'<div class="m6ohs-snapshot-table">'+rows+'</div></div></div>';
}
function bucketCells(row,className){
  var c=className?' '+className:'';
  return '<div class="m6ohs-value'+c+'">'+fmt(row.wo)+'</div><div class="m6ohs-value'+c+'">'+fmt(row.w)+'</div><div class="m6ohs-value'+c+'">'+fmt(row.wo+row.w)+'</div>';
}
function bucketRow(label,row,className){
  return '<div class="'+(className||'')+'">'+label+'</div>'+bucketCells(row,className);
}
function activitiesPanel(){
  var a=D().activities;
  var h='<div class="m6ohs-mini-panel"><p class="m6ohs-mini-title">Statement of Activities (2025)</p>'
    +'<p class="m6ohs-mini-subline">Explains the snapshots&rsquo; net-asset rows: two piles&rsquo; walks, run side by side &middot; year ended December 31, 2025</p>'
    +'<div class="m6ohs-bucket-grid">'
    +'<div></div><div class="m6ohs-bucket-head">Without</div><div class="m6ohs-bucket-head">With</div><div class="m6ohs-bucket-head">Total</div>';
  h+=bucketRow('Net assets, beginning of year',a.netAssetsBeginning,'m6ohs-bucket-opening');
  h+=bucketRow('Operating change (deficit before non-operating)',a.changeBeforeNonoperating,'');
  h+=bucketRow('Non-operating change (endowment return above the draw)',a.totalNonoperating,'');
  h+='<div class="m6ohs-bucket-reclass">(informational: releases from restrictions, inside operating &mdash; a transfer between piles)</div>'
    +'<div class="m6ohs-value m6ohs-bucket-reclass">'+fmt(a.releases.wo)+'</div>'
    +'<div class="m6ohs-value m6ohs-bucket-reclass">'+fmt(a.releases.w)+'</div>'
    +'<div class="m6ohs-value m6ohs-bucket-reclass">'+fmt(a.releases.t2025)+'</div>';
  h+=bucketRow('Change in net assets',a.changeInNetAssets,'');
  h+=bucketRow('Net assets, end of year',a.netAssetsEnd,'m6ohs-bucket-closing');
  h+='</div><p class="m6ohs-mini-note">Closing balances are the Ending snapshot&rsquo;s net-asset rows &mdash; every account walks. The releases row moves promise-kept amounts between the piles; the Total column shows zero: no new money.</p></div>';
  return h;
}
function functionalPanel(){
  var f=D().functional,t=f.totalsRow;
  var pct=Math.round(t.totalProgram/t.t2025*100);
  var salaries=null,depr=null,payroll=null;
  f.rows.forEach(function(r){ if(r.id==='salaries') salaries=r.t2025; if(r.id==='depreciation') depr=r.t2025; if(r.id==='payrollTax') payroll=r.t2025; });
  return '<div class="m6ohs-mini-panel"><p class="m6ohs-mini-title">Statement of Functional Expenses (2025)</p>'
    +'<p class="m6ohs-mini-subline">Details the expense line above: the same total, sorted twice at once &mdash; by kind and by function</p>'
    +'<div class="m6ohs-mini-row"><div>Program services (five named programs)</div><div class="m6ohs-value">'+fmt(t.totalProgram)+'</div></div>'
    +'<div class="m6ohs-mini-row"><div>Management and general</div><div class="m6ohs-value">'+fmt(t.mg)+'</div></div>'
    +'<div class="m6ohs-mini-row"><div>Fundraising</div><div class="m6ohs-value">'+fmt(t.fr)+'</div></div>'
    +'<div class="m6ohs-mini-row m6ohs-mini-total"><div>Total operating expenses</div><div class="m6ohs-value">'+fmt(t.t2025)+'</div></div>'
    +'<p class="m6ohs-mini-note">By kind, the same '+plain(t.t2025)+': salaries '+plain(salaries)+', payroll taxes and benefits '+plain(payroll)+', depreciation '+plain(depr)+' (given, never calculated), feed and supplies, surgical and lab &mdash; eighteen rows, one total. Statements are sortings; program services carry '+pct+' cents of each expense dollar.</p></div>';
}
function cashFlowPanel(){
  var c=D().cfs;
  var depr=null,unreal=null;
  c.operating.adjustments.forEach(function(r){ if(r.id==='depreciation') depr=r.v; if(r.id==='unrealizedGains') unreal=r.v; });
  return '<div class="m6ohs-mini-panel"><p class="m6ohs-mini-title">Statement of Cash Flows (2025)</p>'
    +'<p class="m6ohs-mini-subline">Explains the line hardest to infer from the others &mdash; Cash itself &middot; indirect method &middot; year ended December 31, 2025</p>'
    +'<div class="m6ohs-mini-row"><div>Operating activities</div><div class="m6ohs-value">'+fmt(c.operating.cfo)+'</div></div>'
    +'<div class="m6ohs-mini-row"><div>Investing activities</div><div class="m6ohs-value">'+fmt(c.investing.cfi)+'</div></div>'
    +'<div class="m6ohs-mini-row"><div>Financing activities</div><div class="m6ohs-value">'+fmt(c.financing.cff)+'</div></div>'
    +'<div class="m6ohs-mini-row m6ohs-mini-total"><div>Net change in cash</div><div class="m6ohs-value">'+fmt(c.netChange)+'</div></div>'
    +'<div class="m6ohs-cash-bridge"><div class="m6ohs-mini-row"><div>'+plain(c.cashBeginning)+' + '+plain(c.netChange)+' = '+plain(c.cashEnd)+' &mdash; ties the Cash line of both snapshots</div><div></div></div></div>'
    +'<p class="m6ohs-mini-note">The operating section starts from the change in net assets (+'+plain(c.operating.changeInNetAssets)+') and undoes the no-cash items &mdash; depreciation '+plain(depr)+' added back, unrealized gains '+plain(Math.abs(unreal))+' taken out &mdash; the prework&rsquo;s reconciliation, run as the statement.</p></div>';
}
function architectureView(){
  return '<div class="m6ohs-scope"><div class="m6ohs-architecture-wrap"><div class="m6ohs-architecture">'
    +compactSnapshot('y2024','Beginning','December 31, 2024')
    +'<div class="m6ohs-center-stack">'+activitiesPanel()+functionalPanel()+cashFlowPanel()+'</div>'
    +compactSnapshot('y2025','Ending','December 31, 2025')
    +'</div></div></div>';
}

/* ---------- narration ---------- */
function renderBeats(currentStep){
  var s=D().sfp,L=liq(),Y=D().notes.endowment.y2025,a=D().activities,f=D().functional,c=D().cfs;
  var quasi=liqRow(L.unavailable,'quasi'),donorEnd=liqRow(L.unavailable,'donorEndowment'),annuity=liqRow(L.unavailable,'annuityInvestments');
  var texts=[
    'Four statements, read end to end &mdash; and one question left, the one every reader brings to the bottom line. The Ending Statement of Financial Position shows total net assets of '+plain(s.totalNetAssets.y2025)+'. Can OHS spend it? Careful: net assets is a computed difference &mdash; total assets minus total liabilities &mdash; a classification, not a bank balance. Look at where the total sits: '+plain(61090468)+' of it is net investment in capital assets &mdash; the shelter buildings themselves &mdash; and '+plain(s.withRestrictions.y2025)+' is fenced by donors&rsquo; promises. The spending question is real, and the notes answer it directly. Note 4 &mdash; the liquidity note &mdash; sets the answer out row by row. Read it next.',
    'Note 4, read as pile-fencing. Start from the money-like assets only &mdash; cash, the receivables due within a year, the investments; no buildings, no beneficial interests in trusts: <strong>'+plain(L.totalAvailable.y2025)+'</strong> of financial assets. Then take the fences seriously. The board&rsquo;s own fence first: '+plain(Math.abs(quasi.y2025))+' designated for quasi-endowment &mdash; a choice, and the board could choose otherwise (Note 18). Then the fences only donors can place: '+plain(Math.abs(donorEnd.y2025))+' restricted for endowment, and '+plain(Math.abs(annuity.y2025))+' of investments tied to charitable gift annuities. (The Lulu Madison line shows a dash: that fence came down in 2025 when its time restriction expired.) Finally, add back what is already cleared for next year&rsquo;s spending: '+plain(633955)+' of endowment appropriations and '+plain(501582)+' of board-designated funds approved for expenditure. The bottom line: <strong>'+plain(L.availableWithinOneYear.y2025)+' available within one year for general expenditure</strong>. Watch the rows land.',
    'Scale it. '+plain(L.availableWithinOneYear.y2025)+' of ready money, against '+plain(f.totalsRow.t2025)+' of operating expenses for the year &mdash; roughly five months. Is that alarming? A $107 million organization with five months of ready money sounds thin, until you see that the fences are the mission. The buildings shelter the animals. The endowment &mdash; the board&rsquo;s piece and the donors&rsquo; piece &mdash; is there so the care outlasts any single year. And the donors&rsquo; fences stand until each promise is kept. A shelter that could spend everything tomorrow would be a shelter that promised nothing beyond tomorrow. Liquidity is an asset-side question with a note of its own; the net assets total was never going to answer it.',
    'One more note, and it should look familiar. Note 19 tracks the endowment across the year &mdash; beginning balance, what came in, what was drawn, ending balance. It is a walk table, printed by the auditors: '+plain(Y.begin.total)+' at the start, plus '+plain(Y.contributions.total)+' of new endowment gifts from donors, plus '+plain(Y.boardDesignation.total)+' newly designated by the board, plus '+plain(Y.netReturn.total)+' of net investment return, minus '+plain(Math.abs(Y.appropriation.total))+' appropriated &mdash; approved for spending on operations &mdash; landing at '+plain(Y.end.total)+'. Every account walks; here the walk arrives pre-printed, in four columns at once, and each column walks on its own. The Quasi-endowment column ends at '+plain(Y.end.quasi)+' &mdash; exactly the board&rsquo;s fence from Note 4 &mdash; and the other two columns together end at '+plain(Y.end.accumReturn+Y.end.principal)+' &mdash; the donors&rsquo; fence. The two fences you just subtracted are one endowment, walked.',
    'The full architecture &mdash; four statements, one organization, one screen. The position snapshots flank the year, and the identity ties each one: '+plain(s.totalAssets.y2025)+' &minus; '+plain(s.totalLiabilities.y2025)+' = '+plain(s.totalNetAssets.y2025)+'. Between them, the middle column stacks OHS&rsquo;s three explaining statements. The <strong>Statement of Activities</strong> explains the snapshots&rsquo; net-asset rows &mdash; two piles&rsquo; walks run side by side, with the releases row moving '+plain(a.releases.wo)+' from the donors&rsquo; pile to the free pile as promises were kept: no new money, total zero. (Every account walks; piles are named for their reasons.) The <strong>Statement of Functional Expenses</strong> details the expense line inside it &mdash; the same '+plain(f.totalsRow.t2025)+', sorted by kind and by function at once. (Statements are sortings; the sort is lawful, and it is chosen.) And the <strong>Statement of Cash Flows</strong> explains the line hardest to infer from the others &mdash; Cash: it starts from the year&rsquo;s +'+plain(a.changeInNetAssets.t2025)+', undoes the no-cash items, and lands at '+fmt(c.operating.cfo)+' of operating cash. (The prework&rsquo;s reconciliation, run as the statement itself.) The bike shop&rsquo;s architecture, carrying a $107 million shelter.',
    'You came to these statements as a stranger, and you have now read all four &mdash; tied the identity at both dates, answered the cash question, watched two piles walk, opened the fences one note at a time, sorted '+plain(f.totalsRow.t2025)+' twice, and priced OHS&rsquo;s spendable months from Note 4. That was this module&rsquo;s promise: <strong>reading</strong>. What comes next is the harder skill: <strong>reconstruction</strong>. Given the statements, rebuild the year &mdash; three numbers that tell one story, each from its own statement, all forced to agree. Or first, take the optional detour: the same architecture stretched to $59 billion &mdash; Yale&rsquo;s statements, read with every idiom you just used here.'
  ];
  document.getElementById('beats').innerHTML='<div class="narrative-block"><p>'+texts[currentStep]+'</p></div>';
}
function renderGrid(currentStep){
  var h=currentStep===0?questionCard()
    :currentStep===1?liquidityWalk()
    :currentStep===2?scaleCard()
    :currentStep===3?endowTable()
    :architectureView();
  document.getElementById('mainGrid').innerHTML=h;
}
function renderTail(currentStep){
  var h='';
  if(currentStep===2) h='<div class="m6ohs-scope m6ohs-insight-wrap"><div class="insight-box">Restriction status and spendability are different questions. The statement answers the first; the liquidity note answers the second &mdash; and a healthy answer can be five months, when the fences are the mission.</div></div>';
  if(currentStep===5) h='<div class="m6ohs-scope m6ohs-insight-wrap"><div class="insight-box">Four statements, one organization. Find the snapshots, find the explaining statements between them, read the labels &mdash; the map from the bike shop held at CVS, holds here, and will hold anywhere you point it.</div></div>';
  document.getElementById('tail').innerHTML=h;
}
function renderControls(currentStep){
  var h='<div class="nav-buttons">';
  if(currentStep===0) h+='<button class="btn-back" onclick="nav(\'63-5-The-Statement-of-Functional-Expenses.html\')">&larr; Back</button>';
  else h+='<button class="btn-back" onclick="back()">&larr; Back</button>';
  if(currentStep<TOTAL_STEPS-1) h+='<button class="btn-next" onclick="advance()">Next &rarr;</button>';
  else {
    h+='<button class="btn-next" onclick="nav(\'65-1-The-Statement-of-Financial-Position.html\')">Optional: Yale at scale &rarr;</button>';
    h+='<button class="btn-continue" onclick="nav(\'64-1-The-Year-as-Three-Numbers.html\')">Continue &rarr;</button>';
  }
  h+='</div>';
  document.getElementById('controls').innerHTML=h;
}
function clearRevealTimer(){ if(revealTimer){ clearTimeout(revealTimer); revealTimer=null; } }
function scheduleReveal(){
  clearRevealTimer();
  var total=liqSequence().length;
  if(step!==1 || revealN>=total) return;
  revealTimer=setTimeout(function(){
    revealTimer=null;
    if(step!==1) return;
    revealN++;
    render();
    if(revealN===total) playSuccess();
  },450);
}
function render(){ renderBeats(step); renderGrid(step); renderTail(step); renderControls(step); if(window.lucide) lucide.createIcons(); scheduleReveal(); }
function enterStep(target){
  clearRevealTimer(); step=target;
  if(step===1){ if(revealVisited) revealN=liqSequence().length; else { revealVisited=true; revealN=0; } }
  render(); window.scrollTo(0,0);
}
function advance(){ playClick(); enterStep(Math.min(step+1,TOTAL_STEPS-1)); }
function back(){ playClick(); enterStep(Math.max(step-1,0)); }

var glossaryTerms=[
  {term:'Liquidity',def:'The availability of financial assets to meet near-term general expenditures. An asset-side question, answered in a required note &mdash; never by the net assets total.'},
  {term:'Quasi-endowment',def:'Amounts the board has designated to be invested like endowment. A choice, not a donor restriction &mdash; the board can undesignate, so these amounts stay in Without Donor Restrictions.'},
  {term:'Appropriation',def:'An amount approved to be drawn from endowment return for spending on operations. Next year&rsquo;s approved draw counts as available in the liquidity note.'}
];
function openGlossary(){ document.getElementById('glossaryList').innerHTML=glossaryTerms.map(function(item){ return '<div class="glossary-entry"><div class="glossary-entry-term">'+item.term+'</div><div class="glossary-entry-def">'+item.def+'</div></div>'; }).join(''); document.getElementById('glossaryOverlay').classList.add('open'); if(window.lucide) lucide.createIcons(); }
function closeGlossary(){ document.getElementById('glossaryOverlay').classList.remove('open'); }
function restart(){ window.location.reload(); }
document.addEventListener('keydown',function(event){ if(event.key==='Escape') closeGlossary(); });
window.devFill=function(){ clearRevealTimer(); step=TOTAL_STEPS-1; revealVisited=true; revealN=liqSequence().length; render(); };
render();
</script>
