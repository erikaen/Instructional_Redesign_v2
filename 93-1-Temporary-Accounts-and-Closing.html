<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temporary Accounts and Closing</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .m8-progress {
      margin: 8px 0 0;
      color: #64748b;
      font: 700 .72rem/1.3 Inter, sans-serif;
      letter-spacing: .08em;
      text-align: center;
      text-transform: uppercase;
    }
    .m8-grid { display: grid; gap: 16px; }
    .m8-two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .m8-card {
      border: 1px solid #d5dde7;
      border-radius: 10px;
      padding: 18px;
      background: #fff;
      box-shadow: 0 6px 18px rgba(32,55,72,.07);
    }
    .m8-card h2, .m8-card h3 { margin: 0 0 9px; color: #183153; font-family: Inter, sans-serif; }
    .m8-card p { margin: 8px 0 0; line-height: 1.62; }
    .m8-kicker {
      margin: 0 0 6px;
      color: #64748b;
      font: 800 .73rem/1.3 Inter, sans-serif;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .m8-test {
      border-left: 5px solid #c41230;
      border-radius: 7px;
      padding: 17px 19px;
      background: #fff5f6;
      color: #183153;
      font: 800 clamp(1.05rem, 2.5vw, 1.3rem)/1.5 Inter, sans-serif;
    }
    .m8-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 15px; }
    .m8-tab { border-radius: 7px 7px 3px 3px; padding: 11px 8px; color: #172033; font: 800 .82rem/1.3 Inter, sans-serif; text-align: center; }
    .m8-tab-position { background: #cfe5ff; }
    .m8-tab-income { background: #ffe0a8; }
    .m8-tab-draw { background: #dfd3f4; }
    .m8-bin-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .m8-bin { min-width: 0; padding: 16px 12px; }
    .m8-input-card { max-width: 680px; margin: 0 auto; }
    .m8-answer-row { display: grid; grid-template-columns: minmax(0, 1fr) 110px; gap: 10px; margin-top: 15px; }
    .m8-money-input {
      box-sizing: border-box;
      width: 100%;
      min-height: 44px;
      border: 1px solid #94a3b8;
      border-radius: 7px;
      padding: 9px 11px;
      background: #fff;
      color: #172033;
      font: 700 1rem/1.2 "JetBrains Mono", monospace;
      text-align: right;
    }
    .m8-money-input:focus { outline: 3px solid rgba(40,109,192,.22); border-color: #286dc0; }
    .m8-check { border: 0; border-radius: 7px; background: #286dc0; color: #fff; cursor: pointer; font: 800 .9rem/1 Inter, sans-serif; }
    .m8-feedback { min-height: 1.5em; margin: 9px 0 0; color: #a63b20; font-weight: 700; }
    .m8-success { color: #166534; }
    .m8-journal-wrap { max-width: 760px; margin: 16px auto 0; }
    .m8-reset-note { margin-top: 12px; text-align: center; }
    .m8-reveal {
      overflow: hidden;
      border: 2px solid #c41230;
      border-radius: 12px;
      background: linear-gradient(135deg, #fff8f8, #f4f8ff);
      box-shadow: 0 10px 26px rgba(32,55,72,.12);
      text-align: center;
    }
    .m8-reveal-top { padding: 18px; background: #183153; color: #fff; font: 800 .78rem/1.3 Inter, sans-serif; letter-spacing: .15em; text-transform: uppercase; }
    .m8-reveal-word { margin: 0; padding: 30px 18px 12px; color: #c41230; font: 800 clamp(2rem, 7vw, 4.2rem)/1.05 Inter, sans-serif; letter-spacing: .03em; }
    .m8-reveal-copy { max-width: 720px; margin: 0 auto; padding: 0 24px 28px; font-size: 1.04rem; line-height: 1.65; }
    .m8-door { border-top: 4px solid #183153; }
    .m8-parking { border-top: 4px solid #c41230; }
    .m8-close-test { margin-top: 16px; }
    .m8-glossary-dismiss { border: 0; padding: 2px 7px; background: transparent; color: inherit; cursor: pointer; font-size: 1.7rem; line-height: 1; }
    @media (max-width: 680px) {
      .m8-two, .m8-bin-grid { grid-template-columns: 1fr; }
      .m8-tabs { grid-template-columns: 1fr; }
      .m8-answer-row { grid-template-columns: 1fr; }
      .m8-check { min-height: 42px; }
    }
    @media (prefers-color-scheme: dark) {
      .m8-progress, .m8-kicker { color: #aebbd0; }
      .m8-card { border-color: #4b5567; background: #26242e; box-shadow: 0 7px 20px rgba(0,0,0,.28); }
      .m8-card h2, .m8-card h3 { color: #e7eef9; }
      .m8-test { background: #3b2930; color: #f5e9ec; }
      .m8-tab { color: #172033; }
      .m8-money-input { border-color: #77849a; background: #211f28; color: #e7eef9; }
      .m8-feedback { color: #ffb19d; }
      .m8-success { color: #b6f0c8; }
      .m8-reveal { background: linear-gradient(135deg, #34252b, #232b38); }
      .m8-reveal-word { color: #ff6b82; }
    }
  </style>
</head>
<body>
<div class="page">
  <div class="prework-wrap">
    <div class="tut-header">
      <div class="tut-header-main">
        <h1>Temporary Accounts and Closing</h1>
        <p class="tut-header-sub">Module 9 &middot; ~6 min</p>
      </div>
      <div class="tut-header-actions">
        <button class="icon-btn" title="Glossary" aria-label="Open glossary" onclick="openGlossary()">G</button>
        <button class="icon-btn" title="Reset this phase" aria-label="Reset this phase" onclick="restart()">&#8635;</button>
      </div>
    </div>
    <div class="phase-title" id="phaseTitle">Temporary Accounts and Closing</div>

    <div id="beats"></div>
    <div id="mainGrid"></div>
    <div id="tail"></div>
    <div id="controls"></div>
  </div>
</div>

<div class="glossary-overlay" id="glossaryOverlay" onclick="if(event.target===this) dismissGlossary()">
  <div class="glossary-panel">
    <div class="glossary-panel-head">
      <div class="glossary-panel-title">Glossary</div>
      <button class="m8-glossary-dismiss" aria-label="Dismiss" onclick="dismissGlossary()">&times;</button>
    </div>
    <div class="glossary-list" id="glossaryList"></div>
  </div>
</div>

<script src="m8-data.js"></script>
<script src="toolkit-lab.js"></script>
<script src="shared.js"></script>
<script>
var step=0;
var TOTAL_STEPS=5;
var data=window.M8_DATA;
var closingAnswer={answer:data.incomeStatement.netIncome,tries:0,correct:false,value:''};

function nav(url){ window.location.href=url; }

function render(){
  renderBeats(step);
  renderMain(step);
  renderTail(step);
  renderControls(step);
  wireStep(step);
}

function renderBeats(currentStep){
  var copy=[
    '<strong>Two kinds of accounts.</strong> Some tell you where the company stands. Others tally what happened during the period you chose.',
    '<strong>Two algorithms, one computation.</strong> You already calculated the season\'s result. The profession changes when the sorting happens.',
    '<strong>Closing is emptying the bins.</strong> First, work out what must land in Generated when the four season bins return to zero.',
    '<strong>The reveal.</strong> For seven modules, the course used a plain name for the result the company kept. Here is the profession\'s name.',
    '<strong>Two doors and one parking spot.</strong> Not every change in capital travels through the income bins.'
  ];
  document.getElementById('beats').innerHTML='<div class="narrative-block"><p>'+copy[currentStep]+'</p></div><p class="m8-progress">Reading '+(currentStep+1)+' of '+TOTAL_STEPS+'</p>';
}

function renderMain(currentStep){
  var el=document.getElementById('mainGrid');
  if(currentStep===0){
    el.innerHTML='<div class="m8-grid m8-two">'+
      '<section class="m8-card"><p class="m8-kicker">Permanent accounts</p><h2>Where do we stand?</h2><p>These accounts carry their ending amounts into the next period. They are the accounts you read on the balance sheet.</p></section>'+
      '<section class="m8-card"><p class="m8-kicker">Temporary accounts</p><h2>What happened?</h2><p>These are period-scoped tally bins. They collect one chosen period, then return to zero so the next period gets a clean count.</p></section>'+
      '</div><div class="m8-test m8-close-test" id="testLine"></div>'+
      '<section class="m8-card" style="margin-top:16px"><h3>The workbook already marked the split</h3><p>The three tab colors were telling you which accounts stay and which bins empty. The color coding was the permanent/temporary split all along.</p><div class="m8-tabs" aria-label="The workbook\'s three tab colors"><div class="m8-tab m8-tab-position">Balance-sheet tabs stay</div><div class="m8-tab m8-tab-income">Income bins empty</div><div class="m8-tab m8-tab-draw">Withdrawn empties separately</div></div></section>';
    document.getElementById('testLine').textContent=data.canonLines.notClosedTest;
  } else if(currentStep===1){
    el.innerHTML='<section class="m8-card"><h2>The timing changed, not the answer</h2><p>The course sorted Generated\'s rows once, at season end. The profession pre-sorts during the period into labeled bins: Repair Revenue, Parts Used, Rent, and Depreciation. When the period closes, it empties those bins.</p><p>Same season. Same numbers. The four accounts below show the pre-sorted totals.</p></section><div class="m8-grid m8-bin-grid" id="binGrid" style="margin-top:16px"></div>';
    renderBins();
  } else if(currentStep===2){
    el.innerHTML='<section class="m8-card m8-input-card"><p class="m8-kicker">Before the entry</p><h2>What amount lands in Generated?</h2><p>Empty Repair Revenue against Parts Used, Rent, and Depreciation. Type the difference.</p><div class="m8-answer-row"><input class="m8-money-input" id="closingInput" inputmode="decimal" autocomplete="off" aria-label="Amount that lands in Generated" aria-describedby="closingFeedback" value="'+escapeAttr(closingAnswer.value)+'"><button class="m8-check" id="closingCheck">Check</button></div><p class="m8-feedback'+(closingAnswer.correct?' m8-success':'')+'" id="closingFeedback" aria-live="polite">'+closingFeedback()+'</p></section>';
  } else if(currentStep===3){
    el.innerHTML='<section class="m8-reveal" aria-labelledby="revealWord"><div class="m8-reveal-top">The word withheld for seven modules</div><h2 class="m8-reveal-word" id="revealWord">RETAINED EARNINGS</h2><div class="m8-reveal-copy"><p><strong>Generated has an outside name.</strong> Corporations say Retained Earnings where this course said Generated.</p><p>You met the nonprofit flavor in Module 6: net assets without donor restrictions.</p><p>It is the classic “either balance” account. A profitable history usually leaves a credit balance. A losing history can leave a debit balance.</p></div></section>';
  } else {
    el.innerHTML='<div class="m8-grid m8-two"><section class="m8-card m8-door"><p class="m8-kicker">The other door</p><h2>The draw</h2><p id="drawLine"></p></section><section class="m8-card m8-parking"><p class="m8-kicker">The parking spot</p><h2>OCI</h2><p id="ociLine"></p></section></div><div class="m8-test m8-close-test" id="finalTestLine"></div>';
    document.getElementById('drawLine').textContent=data.canonLines.drawDoor;
    document.getElementById('ociLine').textContent=data.canonLines.oci;
    document.getElementById('finalTestLine').textContent=data.canonLines.notClosedTest;
  }
}

function allActivity(){ return data.seasonEntries.concat(data.adjustingEntries); }

function renderBins(){
  var names=['Repair Revenue','Parts Used','Rent','Depreciation'];
  var host=document.getElementById('binGrid');
  names.forEach(function(name){
    var wrap=document.createElement('section');
    wrap.setAttribute('class','m8-card m8-bin');
    host.appendChild(wrap);
    var rows=[];
    allActivity().forEach(function(entry){
      entry.lines.forEach(function(line){
        if(line.acct===name){
          rows.push({side:line.side==='cr'?'credit':'debit',label:entry.narration,amt:line.amt});
        }
      });
    });
    ToolkitLab.renderTAccount(wrap,{name:name,rows:rows},{showBalance:true});
  });
}

function renderTail(currentStep){
  var el=document.getElementById('tail');
  el.innerHTML='';
  if(currentStep===2 && closingAnswer.correct){
    el.innerHTML='<div class="m8-journal-wrap"><div id="closingJournal"></div><p class="m8-reset-note">Revenue is debited shut. Each expense is credited shut. The difference lands in Generated. Next season starts at zero.</p></div>';
    ToolkitLab.renderJournalEntry(document.getElementById('closingJournal'),data.closingEntry,{mode:'formatted',totals:true});
  }
}

function renderControls(currentStep){
  var html='<div class="nav-buttons">';
  if(currentStep===0) html+='<button class="btn-back" onclick="nav(\'92-1-Adjusting-Entries.html\')">&larr; Back</button>';
  else html+='<button class="btn-back" onclick="back()">&larr; Back</button>';
  if(currentStep<TOTAL_STEPS-1){
    var locked=currentStep===2&&!closingAnswer.correct;
    html+='<button class="btn-next" onclick="advance()"'+(locked?' disabled aria-disabled="true"':'')+'>Next &rarr;</button>';
  } else {
    html+='<button class="btn-continue" onclick="nav(\'94-1-Contra-and-Adjunct-Accounts.html\')">Contra and Adjunct Accounts &rarr;</button>';
  }
  html+='</div>';
  document.getElementById('controls').innerHTML=html;
}

function wireStep(currentStep){
  if(currentStep!==2||closingAnswer.correct)return;
  var input=document.getElementById('closingInput');
  var button=document.getElementById('closingCheck');
  input.addEventListener('input',function(){ closingAnswer.value=this.value; });
  input.addEventListener('keydown',function(event){ if(event.key==='Enter'){ event.preventDefault(); checkClosing(); } });
  button.addEventListener('click',checkClosing);
}

function parsedAnswer(value){
  var clean=String(value).replace(/[$,\s]/g,'');
  if(!clean||!/^[-+]?\d+(?:\.\d+)?$/.test(clean))return null;
  return Number(clean);
}

function closingFeedback(){
  if(closingAnswer.correct)return 'Correct. Now read the closing entry.';
  if(closingAnswer.tries===1)return 'Start with revenue, then subtract all three expense bins.';
  if(closingAnswer.tries===2)return 'Use the four season totals shown on the previous view.';
  if(closingAnswer.tries>=3)return 'The amount is '+closingAnswer.answer.toLocaleString('en-US')+'. Enter it to reveal the entry.';
  return '';
}

function checkClosing(){
  if(closingAnswer.correct)return;
  var input=document.getElementById('closingInput');
  closingAnswer.value=input?input.value:closingAnswer.value;
  if(parsedAnswer(closingAnswer.value)===closingAnswer.answer){
    closingAnswer.correct=true;
  } else {
    closingAnswer.tries+=1;
  }
  renderMain(step);
  renderTail(step);
  renderControls(step);
  wireStep(step);
  if(!closingAnswer.correct){
    var fresh=document.getElementById('closingInput');
    if(fresh){ fresh.focus(); fresh.select(); }
  }
}

function escapeAttr(value){ return String(value).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

function advance(){
  if(step===2&&!closingAnswer.correct)return;
  step=Math.min(step+1,TOTAL_STEPS-1);
  render();
  window.scrollTo(0,0);
}

function back(){
  step=Math.max(step-1,0);
  render();
  window.scrollTo(0,0);
}

var glossaryTerms=[
  {term:'Temporary account',def:'A period-scoped tally bin that is closed to zero when the period ends.'},
  {term:'Permanent account',def:'An account whose ending amount carries into the next period and appears on the balance sheet.'},
  {term:'Closing',def:'The season-end process that empties temporary accounts into capital.'},
  {term:'Retained Earnings',def:'The corporate name for Generated: the accumulated results the corporation has kept.'}
];

function openGlossary(){
  document.getElementById('glossaryList').innerHTML=glossaryTerms.map(function(item){
    return '<div class="glossary-entry"><div class="glossary-entry-term">'+item.term+'</div><div class="glossary-entry-def">'+item.def+'</div></div>';
  }).join('');
  document.getElementById('glossaryOverlay').classList.add('open');
}

function dismissGlossary(){ document.getElementById('glossaryOverlay').classList.remove('open'); }

function restart(){
  step=0;
  closingAnswer.tries=0;
  closingAnswer.correct=false;
  closingAnswer.value='';
  render();
  window.scrollTo(0,0);
}

document.addEventListener('keydown',function(event){ if(event.key==='Escape')dismissGlossary(); });

window.devFill=function(){
  closingAnswer.correct=true;
  closingAnswer.value=String(closingAnswer.answer);
  step=TOTAL_STEPS-1;
  render();
};

render();
</script>
<!-- Static audit anchors rendered above from M8_DATA: will be on the balance sheet; through its own door; comprehensive income; 2,640. -->
<script src="dev.js"></script>
</body>
</html>
