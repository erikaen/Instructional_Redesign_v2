      max-width:1500px;
      margin:0 auto;
      padding:28px 20px 36px;
      color:var(--m6ohs-ink);
      font-family:Inter,"Open Sans",sans-serif;
    }
    .m6ohs-scope *, .m6ohs-scope *::before, .m6ohs-scope *::after { box-sizing:inherit; }
    .m6ohs-page-kicker {
      margin:0 0 7px;
      color:var(--m6ohs-accent);
      font-size:11px;
      font-weight:800;
      letter-spacing:.12em;
      text-transform:uppercase;
    }
    .m6ohs-page-title { margin:0; color:var(--m6ohs-primary); font-size:clamp(24px,3vw,38px); line-height:1.15; }
    .m6ohs-page-subtitle { margin:8px 0 24px; color:var(--m6ohs-muted); font-size:14px; }
    .m6ohs-scroll { overflow-x:auto; padding:2px 2px 14px; }
    .m6ohs-grid {
      display:grid;
      grid-template-columns:minmax(245px,.9fr) minmax(390px,1.45fr) minmax(245px,.9fr);
      gap:14px;
      align-items:start;
      min-width:920px;
    }
    .m6ohs-column { min-width:0; }
    .m6ohs-center { display:grid; gap:10px; }
    .m6ohs-card, .m6ohs-panel {
      border:1px solid var(--m6ohs-rule);
      background:var(--m6ohs-paper);
      color:var(--m6ohs-ink);
      box-shadow:0 8px 24px var(--m6ohs-shadow);
    }
    .m6ohs-card { padding:17px; border-radius:12px; }
    .m6ohs-panel { padding:14px; border-radius:10px; }
    .m6ohs-kicker {
      margin:0 0 5px;
      color:var(--m6ohs-muted);
      font-size:10px;
      font-weight:800;
      letter-spacing:.1em;
      text-transform:uppercase;
    }
    .m6ohs-title { margin:0; color:var(--m6ohs-primary); font-size:17px; line-height:1.25; }
    .m6ohs-panel .m6ohs-title { font-size:13px; letter-spacing:.035em; }
    .m6ohs-subline { margin:4px 0 0; color:var(--m6ohs-muted); font-size:11px; font-style:italic; line-height:1.45; }
    .m6ohs-date { margin:3px 0 0; color:var(--m6ohs-muted); font-size:11px; }
    .m6ohs-section { margin-top:15px; }
    .m6ohs-section-head { display:flex; align-items:center; gap:6px; margin-bottom:3px; }
    .m6ohs-section-label { color:var(--m6ohs-muted); font-size:10px; font-weight:800; letter-spacing:.09em; text-transform:uppercase; }
    .m6ohs-help {
      display:inline-grid;
      width:18px;
      height:18px;
      padding:0;
      place-items:center;
      border:1px solid var(--m6ohs-rule);
      border-radius:50%;
      background:var(--m6ohs-soft);
      color:var(--m6ohs-primary);
      font:700 11px/1 Inter,sans-serif;
      cursor:pointer;
    }
    .m6ohs-help:hover, .m6ohs-help:focus-visible, .m6ohs-expand:hover, .m6ohs-expand:focus-visible {
      outline:2px solid var(--m6ohs-accent);
      outline-offset:2px;
    }
    .m6ohs-definition { margin:4px 0 6px; padding:6px 8px; border-left:2px solid var(--m6ohs-accent); background:var(--m6ohs-soft); color:var(--m6ohs-muted); font-size:10px; line-height:1.4; }
    .m6ohs-expand {
      width:100%;
      margin:0;
      padding:5px 0;
      border:0;
      border-radius:2px;
      background:transparent;
      color:inherit;
      font:inherit;
      text-align:left;
      cursor:pointer;
    }
    .m6ohs-row, .m6ohs-expand-inner {
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(76px,auto);
      gap:8px;
      align-items:baseline;
    }
    .m6ohs-row { padding:3px 0; font-size:10.5px; }
    .m6ohs-chevron { display:inline-block; width:1.05em; color:var(--m6ohs-primary); }
    .m6ohs-value {
      text-align:right;
      white-space:nowrap;
      font-family:"JetBrains Mono",monospace;
      font-variant-numeric:tabular-nums;
    }
    .m6ohs-total {
      margin-top:3px;
      padding-top:6px;
      border-top:1px solid var(--m6ohs-rule-strong);
      color:var(--m6ohs-primary);
      font-size:11px;
      font-weight:800;
    }
    .m6ohs-detail { margin:3px 0 7px 12px; padding:5px 0 4px 9px; border-left:2px solid var(--m6ohs-rule); }
    .m6ohs-detail .m6ohs-row { color:var(--m6ohs-muted); font-size:9.5px; }
    .m6ohs-subtotal { margin-top:3px; padding-top:4px !important; border-top:1px solid var(--m6ohs-rule); color:var(--m6ohs-ink) !important; font-weight:700; }
    .m6ohs-identity, .m6ohs-walk {
      margin:12px 0 0;
      padding-top:8px;
      border-top:1px solid var(--m6ohs-rule);
      color:var(--m6ohs-muted);
      font-size:9.5px;
      font-style:italic;
      line-height:1.45;
    }
    .m6ohs-identity { text-align:center; }
    .m6ohs-walk { color:var(--m6ohs-primary); font-weight:800; font-style:normal; }
    .m6ohs-summary { margin-top:9px; }
    .m6ohs-summary > .m6ohs-expand { border-bottom:1px solid var(--m6ohs-rule); }
    .m6ohs-summary-label { font-size:10.5px; line-height:1.35; }
    .m6ohs-detail-note, .m6ohs-note { margin:6px 0 0; color:var(--m6ohs-muted); font-size:9.5px; font-style:italic; line-height:1.45; }
    .m6ohs-piles { margin:3px 0 5px; padding:5px 6px; border-radius:4px; background:var(--m6ohs-soft); }
    .m6ohs-pile-grid {
      display:grid;
      grid-template-columns:repeat(2,minmax(64px,auto));
      gap:5px;
      align-items:baseline;
      justify-content:end;
      color:var(--m6ohs-muted);
      font-size:9px;
      font-style:italic;
    }
    .m6ohs-pile-head { font-weight:700; text-align:right; }
    .m6ohs-subheading { margin:8px 0 3px; color:var(--m6ohs-muted); font-size:9.5px; font-weight:800; letter-spacing:.04em; }
    .m6ohs-purpose-grid {
      display:grid;
      grid-template-columns:minmax(150px,1fr) minmax(72px,auto);
      gap:4px 8px;
      align-items:baseline;
      font-size:9.5px;
    }
    .m6ohs-purpose-grid > :nth-child(even) { text-align:right; font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums; }
    .m6ohs-purpose-subtotal { padding-top:4px; border-top:1px solid var(--m6ohs-rule); font-weight:800; }
    .m6ohs-footer { margin:14px 2px 0; color:var(--m6ohs-muted); font-size:10px; font-style:italic; }
    [hidden] { display:none !important; }
    @media (max-width:700px) {
      .m6ohs-scope { padding:20px 12px 28px; }

  <script>
    (function () {
      "use strict";

      var encodedData = document.getElementById("ohs-map-data").textContent;
      var dataDecoder = document.createElement("textarea");
      dataDecoder.innerHTML = encodedData;
      var data = JSON.parse(dataDecoder.value);
      var serial = 0;

      function el(tag, className, text) {
        var node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function fmt(value) {
        var absolute = Math.abs(value).toLocaleString("en-US", { maximumFractionDigits: 0 });
        return value < 0 ? "(" + absolute + ")" : absolute;
      }

      function amountRow(label, value, extraClass) {
        var row = el("div", "m6ohs-row" + (extraClass ? " " + extraClass : ""));
        row.append(el("div", "", label), el("div", "m6ohs-value", fmt(value)));
        return row;
      }

      function expandable(label, value, detail, extraClass, totalKind) {
        serial += 1;
        var id = "m6ohs-detail-" + serial;
        var button = el("button", "m6ohs-expand" + (extraClass ? " " + extraClass : ""));
        button.type = "button";
        button.setAttribute("aria-expanded", "false");
        button.setAttribute("aria-controls", id);
        if (totalKind) button.setAttribute("data-total", totalKind);
        var inner = el("span", "m6ohs-expand-inner");
        var labelNode = el("span", "m6ohs-summary-label");
        labelNode.append(el("span", "m6ohs-chevron", "▸"), document.createTextNode(label));
        inner.append(labelNode, el("span", "m6ohs-value", fmt(value)));
        button.append(inner);
        detail.id = id;
        detail.hidden = true;
        button.addEventListener("click", function () {
          var open = button.getAttribute("aria-expanded") === "true";
          button.setAttribute("aria-expanded", String(!open));
          button.querySelector(".m6ohs-chevron").textContent = open ? "▸" : "▾";
          detail.hidden = open;
        });
        var wrap = el("div", "m6ohs-expandable");
        wrap.append(button, detail);
        return wrap;
      }

      function helpButton(definition) {
        serial += 1;
        var id = "m6ohs-definition-" + serial;
        var wrap = document.createDocumentFragment();
        var button = el("button", "m6ohs-help", "?");
        button.type = "button";
        button.setAttribute("aria-label", "Show definition");
        button.setAttribute("aria-expanded", "false");
        button.setAttribute("aria-controls", id);
        var note = el("p", "m6ohs-definition", definition);
        note.id = id;
        note.hidden = true;
        button.addEventListener("click", function () {
          var open = button.getAttribute("aria-expanded") === "true";
          button.setAttribute("aria-expanded", String(!open));
          note.hidden = open;
        });
        wrap.append(button, note);
        return wrap;
      }

      function splitBlock(item) {
        var box = el("div", "m6ohs-piles");
        var grid = el("div", "m6ohs-pile-grid");
        grid.append(
          el("div", "m6ohs-pile-head", "Without"),
          el("div", "m6ohs-pile-head", "With"),
          el("div", "m6ohs-value", fmt(item.wo)),
          el("div", "m6ohs-value", fmt(item.w))
        );
        box.append(grid);
        return box;
      }

      function detailForActivityLines(lines) {
        var detail = el("div", "m6ohs-detail");
        lines.forEach(function (item) {
          detail.append(amountRow(item.label, item.t2025));
          if (item.w !== 0) detail.append(splitBlock(item));
        });
        return detail;
      }

      function snapshot(year, date, kicker) {
        var card = el("article", "m6ohs-card");
        card.append(
          el("p", "m6ohs-kicker", kicker),
          el("h2", "m6ohs-title", "Statement of Financial Position"),
          el("p", "m6ohs-subline", "Their name for the balance sheet"),
          el("p", "m6ohs-date", date)
        );

        function section(label, definition, totalLabel, totalValue, detail, totalKind) {
          var part = el("section", "m6ohs-section");
          var head = el("div", "m6ohs-section-head");
          head.append(el("span", "m6ohs-section-label", label), helpButton(definition));
          part.append(head, expandable(totalLabel, totalValue, detail, "m6ohs-total", totalKind));
          card.append(part);
        }

        var assetDetail = el("div", "m6ohs-detail");
        data.sfp.assets.forEach(function (item) { assetDetail.append(amountRow(item.label, item[year])); });
        section("Assets", "Economic benefits owned or controlled by OHS.", "Total Assets", data.sfp.totalAssets[year], assetDetail, "assets");

        var liabilityDetail = el("div", "m6ohs-detail");
        data.sfp.liabilities.forEach(function (item) { liabilityDetail.append(amountRow(item.label, item[year])); });
        section("Liabilities", "Obligations to sacrifice economic benefits in the future.", "Total Liabilities", data.sfp.totalLiabilities[year], liabilityDetail, "liabilities");

        var netDetail = el("div", "m6ohs-detail");
        data.sfp.netAssetsWithout.forEach(function (item) { netDetail.append(amountRow(item.label, item[year])); });
        netDetail.append(
          amountRow("Total without donor restrictions", data.sfp.totalWithout[year], "m6ohs-subtotal"),
          amountRow("With donor restrictions", data.sfp.withRestrictions[year])
        );
        section("Net Assets", "The difference: total assets minus total liabilities (A − L = Net Assets).", "Total Net Assets", data.sfp.totalNetAssets[year], netDetail, "netassets");

        var identity = el("p", "m6ohs-identity");
        identity.textContent = "A − L = Net Assets ✓ · " + fmt(data.sfp.totalAssets[year]) + " − " + fmt(data.sfp.totalLiabilities[year]) + " = " + fmt(data.sfp.totalNetAssets[year]);
        card.append(identity);
        return card;
      }

      function panel(title, subline) {
        var card = el("article", "m6ohs-panel");
        card.append(el("h2", "m6ohs-title", title), el("p", "m6ohs-subline", subline));
        return card;
      }

      function activitiesPanel() {
        var a = data.activities;
        var card = panel("Statement of Activities", "Plays the income statement's role: why net assets changed this year · year ended December 31, 2025");
        var summary = el("div", "m6ohs-summary");

        var revenueDetail = detailForActivityLines(a.operatingRevenues);
        revenueDetail.append(amountRow("Total operating revenues, gains, and other support before appropriation and releases", a.totalOperatingRevenuesGains.t2025, "m6ohs-subtotal"));
        [a.appropriation, a.releases].forEach(function (item) {
          revenueDetail.append(amountRow(item.label, item.t2025), splitBlock(item));
        });
        revenueDetail.append(
          amountRow("Operating revenues, gains, and other support", a.totalOperatingSupport.t2025, "m6ohs-subtotal"),
          el("p", "m6ohs-detail-note", "A release moves money BETWEEN the two piles, no new money.")
        );
        summary.append(expandable("Operating revenues, gains, and other support", a.totalOperatingSupport.t2025, revenueDetail));

        var expenseDetail = detailForActivityLines(a.operatingExpenses);
        expenseDetail.append(amountRow("Operating expenses", a.totalOperatingExpenses.t2025, "m6ohs-subtotal"));
        summary.append(expandable("Operating expenses", a.totalOperatingExpenses.t2025, expenseDetail));

        var beforeDetail = el("div", "m6ohs-detail");
        beforeDetail.append(splitBlock(Object.assign({ label:"Change in net assets before non-operating" }, a.changeBeforeNonoperating)));
        summary.append(expandable("Change in net assets before non-operating", a.changeBeforeNonoperating.t2025, beforeDetail));

        var nonoperatingDetail = detailForActivityLines(a.nonoperating);
        nonoperatingDetail.append(amountRow("Non-operating activities", a.totalNonoperating.t2025, "m6ohs-subtotal"));
        summary.append(expandable("Non-operating activities", a.totalNonoperating.t2025, nonoperatingDetail));

        var changeDetail = el("div", "m6ohs-detail");
        changeDetail.append(
          splitBlock(Object.assign({ label:"Change in net assets" }, a.changeInNetAssets)),
          splitBlock(Object.assign({ label:"Net assets, beginning" }, a.netAssetsBeginning)),
          splitBlock(Object.assign({ label:"Net assets, end" }, a.netAssetsEnd))
        );
        summary.append(expandable("Change in net assets", a.changeInNetAssets.t2025, changeDetail));
        card.append(summary);
        var walk = el("p", "m6ohs-walk");
        walk.textContent = fmt(a.netAssetsBeginning.t2025) + " + " + fmt(a.changeInNetAssets.t2025) + " = " + fmt(a.netAssetsEnd.t2025) + " — the net assets walk ties the two balance sheets";
        card.append(walk);
        return card;
      }

      function functionalPanel() {
        var f = data.functional;
        var card = panel("Statement of Functional Expenses", "The nonprofit's own statement: expenses broken down by kind and by function.");
        var summary = el("div", "m6ohs-summary");
        var kindDetail = el("div", "m6ohs-detail");
        f.rows.forEach(function (item) { kindDetail.append(amountRow(item.label, item.t2025)); });
        kindDetail.append(amountRow("Total expenses", f.totalsRow.t2025, "m6ohs-subtotal"));
        summary.append(expandable("By kind — " + f.rows.length + " rows", f.totalsRow.t2025, kindDetail));

        var purposeDetail = el("div", "m6ohs-detail");
        var purposeGrid = el("div", "m6ohs-purpose-grid");
        f.programColumns.forEach(function (label, index) {
          purposeGrid.append(el("div", "", label), el("div", "", fmt(f.totalsRow.cells[index])));
        });
        purposeGrid.append(
          el("div", "m6ohs-purpose-subtotal", "Total program services"),
          el("div", "m6ohs-purpose-subtotal", fmt(f.totalsRow.totalProgram)),
          el("div", "", f.supportingColumns[0]),
          el("div", "", fmt(f.totalsRow.mg)),
          el("div", "", f.supportingColumns[1]),
          el("div", "", fmt(f.totalsRow.fr)),
          el("div", "m6ohs-purpose-subtotal", "Total supporting services"),
          el("div", "m6ohs-purpose-subtotal", fmt(f.totalsRow.totalSupporting)),
          el("div", "m6ohs-purpose-subtotal", "Total expenses"),
          el("div", "m6ohs-purpose-subtotal", fmt(f.totalsRow.t2025))
        );
        purposeDetail.append(purposeGrid);
        summary.append(expandable("By function — " + (f.programColumns.length + f.supportingColumns.length) + " columns", f.totalsRow.t2025, purposeDetail));
        card.append(summary, el("p", "m6ohs-note", "The same " + fmt(f.totalsRow.t2025) + ", broken down two ways at once — by kind and by function."));
        return card;
      }

      function cashDetail(lines) {
        var detail = el("div", "m6ohs-detail");
        lines.forEach(function (item) { detail.append(amountRow(item.label, item.v)); });
        return detail;
      }

      function cashFlowsPanel() {
        var c = data.cfs;
        var card = panel("Statement of Cash Flows", "Same name, same job: why cash changed this year · year ended December 31, 2025 · The operating section uses the indirect method — it reconciles the change in net assets to the operating cash flow.");
        var summary = el("div", "m6ohs-summary");
        var operatingDetail = el("div", "m6ohs-detail");
        operatingDetail.append(
          amountRow("Change in net assets", c.operating.changeInNetAssets),
          el("div", "m6ohs-subheading", "Adjustments — undoing the no-cash items")
        );
        c.operating.adjustments.forEach(function (item) { operatingDetail.append(amountRow(item.label, item.v)); });
        operatingDetail.append(el("div", "m6ohs-subheading", "Changes in operating assets and liabilities"));
        c.operating.workingCapital.forEach(function (item) { operatingDetail.append(amountRow(item.label, item.v)); });
        operatingDetail.append(amountRow("Operating activities", c.operating.cfo, "m6ohs-subtotal"));
        summary.append(
          expandable("Operating activities", c.operating.cfo, operatingDetail),
          expandable("Investing activities", c.investing.cfi, cashDetail(c.investing.lines)),
          expandable("Financing activities", c.financing.cff, cashDetail(c.financing.lines))
        );
        card.append(summary);
        var walk = el("p", "m6ohs-walk");
        walk.textContent = fmt(c.cashBeginning) + " + " + fmt(c.netChange) + " = " + fmt(c.cashEnd) + " — the cash walk ties the Cash line of the two balance sheets";
        card.append(walk);
        return card;
      }

      document.getElementById("m6ohs-left").append(snapshot("y2024", data.meta.beginDate, "Beginning snapshot"));
      document.getElementById("m6ohs-center").append(activitiesPanel(), functionalPanel(), cashFlowsPanel());
      document.getElementById("m6ohs-right").append(snapshot("y2025", data.meta.endDate, "Ending snapshot"));
    }());
  </script>
  <script src="shared.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    if (window.lucide) lucide.createIcons();

    var audioCtx = null;
    function ac() {
      if (!audioCtx) {
        try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
      }
      return audioCtx;
    }
    function tone(frequency, duration, type, volume) {
      var context = ac();
      if (!context) return;
      var oscillator = context.createOscillator();
      var gain = context.createGain();
      oscillator.type = type || "sine";
      oscillator.frequency.value = frequency;
      oscillator.connect(gain);
      gain.connect(context.destination);
      gain.gain.setValueAtTime(volume || 0.05, context.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, context.currentTime + duration);
      oscillator.start();
      oscillator.stop(context.currentTime + duration);
    }
    function playClick() { tone(600, 0.08, "sine", 0.04); }
    function playSuccess() {
      tone(660, 0.09, "sine", 0.04);
      window.setTimeout(function () { tone(880, 0.12, "sine", 0.04); }, 80);
    }

    var glossaryTerms = [
      { term:"Statement of Financial Position", def:"A nonprofit balance sheet that reports assets, liabilities, and net assets at a specific date." },
      { term:"Statement of Activities", def:"The statement that explains why net assets changed during the period and plays the income statement's role." },
      { term:"Statement of Functional Expenses", def:"The nonprofit statement that breaks expenses down by kind and by function." },
      { term:"Statement of Cash Flows", def:"The statement that explains why cash changed during the period through operating, investing, and financing activities." },
      { term:"Net Assets", def:"The difference between total assets and total liabilities, presented with and without donor restrictions." },
      { term:"Donor restriction", def:"A donor-imposed purpose or time condition that classifies net assets as with donor restrictions until the condition is met." }
    ];

    function openGlossary() {
      document.getElementById("glossaryList").innerHTML = glossaryTerms.map(function (item) {
        return '<div class="glossary-entry"><div class="glossary-entry-term">' + item.term + '</div><div class="glossary-entry-def">' + item.def + '</div></div>';
      }).join("");
      document.getElementById("glossaryOverlay").classList.add("open");
      if (window.lucide) lucide.createIcons();
    }
    function closeGlossary() {
      document.getElementById("glossaryOverlay").classList.remove("open");
    }
    function restart() {
      playClick();
      closeGlossary();
      document.querySelectorAll(".m6ohs-expand[aria-expanded='true']").forEach(function (button) {
        button.setAttribute("aria-expanded", "false");
        var chevron = button.querySelector(".m6ohs-chevron");
        if (chevron) chevron.textContent = "▸";
        var detail = document.getElementById(button.getAttribute("aria-controls"));
        if (detail) detail.hidden = true;
      });
      document.querySelectorAll(".m6ohs-help[aria-expanded='true']").forEach(function (button) {
        button.setAttribute("aria-expanded", "false");
        var definition = document.getElementById(button.getAttribute("aria-controls"));
        if (definition) definition.hidden = true;
      });
      window.scrollTo(0, 0);
    }
    function nav(url) {
      playClick();
      window.location.href = url;
    }
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") closeGlossary();
    });
    window.devFill = function () {};
  </script>
  <script src="dev.js"></script>
