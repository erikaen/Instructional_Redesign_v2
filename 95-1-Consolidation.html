<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Consolidation</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .con-progress {
      margin:8px 0 0;
      color:#64748b;
      font:700 .72rem/1.3 Inter,sans-serif;
      letter-spacing:.08em;
      text-align:center;
      text-transform:uppercase;
    }
    .con-stage {
      margin-top:16px;
      min-height:300px;
      border:1px solid #cbd5e1;
      border-radius:12px;
      background:#fff;
      box-shadow:0 7px 20px rgba(32,55,72,.08);
      padding:26px;
    }
    .con-kicker {
      margin:0 0 7px;
      color:#286dc0;
      font:800 .72rem/1.3 Inter,sans-serif;
      letter-spacing:.09em;
      text-transform:uppercase;
    }
    .con-stage h2 {
      margin:0 0 12px;
      color:#16324a;
      font:800 clamp(1.3rem,2.5vw,1.8rem)/1.2 Inter,sans-serif;
    }
    .con-stage p {
      max-width:780px;
      margin:0 0 12px;
      color:#334155;
      font:400 1rem/1.65 "Open Sans",sans-serif;
    }
    .con-statement {
      max-width:680px;
      margin:24px auto 4px;
      border:1px solid #cbd5e1;
      border-radius:9px;
      overflow:hidden;
      background:#f8fafc;
      text-align:center;
    }
    .con-company {
      padding:16px 20px 4px;
      color:#16324a;
      font:800 1.05rem/1.3 Inter,sans-serif;
      letter-spacing:.03em;
      text-transform:uppercase;
    }
    .con-title-line {
      padding:6px 20px 18px;
      color:#286dc0;
      font:800 clamp(1.15rem,2.5vw,1.55rem)/1.3 Inter,sans-serif;
    }
    .con-rule { height:5px; background:#286dc0; }
    .con-family {
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:12px;
      max-width:760px;
      margin:24px auto 14px;
      padding:28px 18px 18px;
      border:3px solid #286dc0;
      border-radius:22px;
      position:relative;
      background:#f8fbff;
    }
    .con-family-label {
      position:absolute;
      top:-12px;
      left:50%;
      transform:translateX(-50%);
      padding:3px 12px;
      border-radius:999px;
      background:#286dc0;
      color:#fff;
      white-space:nowrap;
      font:800 .76rem/1.3 Inter,sans-serif;
      letter-spacing:.05em;
      text-transform:uppercase;
    }
    .con-entity {
      display:flex;
      min-height:80px;
      align-items:center;
      justify-content:center;
      border:1px solid #94a3b8;
      border-radius:9px;
      background:#fff;
      color:#334155;
      text-align:center;
      font:700 .9rem/1.35 Inter,sans-serif;
    }
    .con-entity.parent { border-width:2px; border-color:#286dc0; color:#16324a; }
    .con-outside-note {
      max-width:760px;
      margin:0 auto;
      color:#64748b;
      text-align:center;
      font:600 .84rem/1.45 "Open Sans",sans-serif;
    }
    .con-scenarios { display:grid; gap:12px; margin-top:22px; }
    .con-scenario {
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:16px;
      align-items:center;
      border:1px solid #cbd5e1;
      border-radius:9px;
      padding:15px 16px;
      background:#f8fafc;
    }
    .con-scenario.is-correct { border-color:#4e966a; background:#ecfdf3; }
    .con-scenario-title { color:#172033; font:800 .96rem/1.35 Inter,sans-serif; }
    .con-scenario-note { margin-top:3px; color:#64748b; font:400 .84rem/1.4 "Open Sans",sans-serif; }
    .con-actions { display:flex; flex-wrap:wrap; gap:7px; justify-content:flex-end; }
    .con-choice {
      min-height:38px;
      border:1px solid #94a3b8;
      border-radius:999px;
      padding:7px 13px;
      background:#fff;
      color:#334155;
      cursor:pointer;
      font:800 .8rem/1 Inter,sans-serif;
    }
    .con-choice:hover:not(:disabled), .con-choice:focus-visible { border-color:#286dc0; color:#286dc0; outline:none; }
    .con-choice.correct { border-color:#28864f; background:#28864f; color:#fff; }
    .con-choice:disabled { cursor:default; opacity:.68; }
    .con-choice.correct:disabled { opacity:1; }
    .con-feedback {
      grid-column:1 / -1;
      min-height:0;
      margin:0;
      color:#a63b20;
      font:600 .84rem/1.4 "Open Sans",sans-serif;
    }
    .con-scenario.is-correct .con-feedback { color:#166534; }
    .con-choice.bounce { animation:con-bounce .28s ease; }
    @keyframes con-bounce {
      0%,100% { transform:translateX(0); }
      35% { transform:translateX(-5px); }
      70% { transform:translateX(4px); }
    }
    .con-reading {
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:12px;
      margin-top:22px;
    }
    .con-reading-card {
      border-top:4px solid #286dc0;
      border-radius:8px;
      padding:17px;
      background:#f1f5f9;
      color:#334155;
      font:600 .92rem/1.55 "Open Sans",sans-serif;
    }
    .con-reading-card strong { display:block; margin-bottom:5px; color:#16324a; font:800 .95rem/1.3 Inter,sans-serif; }
    .con-glossary-dismiss {
      border:0;
      padding:2px 7px;
      background:transparent;
      color:inherit;
      cursor:pointer;
      font-size:1.7rem;
      line-height:1;
    }
    #tail { margin-top:16px; }
    #controls { margin-top:18px; }
    @media (max-width:700px) {
      .con-stage { padding:20px 16px; }
      .con-family, .con-reading { grid-template-columns:1fr; }
      .con-scenario { grid-template-columns:1fr; }
      .con-actions { justify-content:flex-start; }
    }
    @media (prefers-color-scheme:dark) {
      .con-progress { color:#aebbd0; }
      .con-stage { border-color:#4b5567; background:#26242e; box-shadow:0 7px 20px rgba(0,0,0,.28); }
      .con-stage h2, .con-company { color:#e7eef9; }
      .con-stage p, .con-entity, .con-scenario-title, .con-reading-card { color:#c8ccd8; }
      .con-statement, .con-scenario { border-color:#4b5567; background:#211f28; }
      .con-family { background:#211f28; }
      .con-entity, .con-choice { border-color:#77849a; background:#302e39; color:#c8ccd8; }
      .con-scenario.is-correct { border-color:#4e966a; background:#183425; }
      .con-scenario.is-correct .con-feedback { color:#b6f0c8; }
      .con-feedback { color:#ffb19d; }
      .con-reading-card { background:#302e39; }
      .con-reading-card strong { color:#e7eef9; }
    }
  </style>
</head>
<body>
<div class="page">
  <div class="prework-wrap">
    <div class="tut-header">
      <div class="tut-header-main">
        <h1>Consolidation</h1>
        <p class="tut-header-sub">Module 9 &middot; ~4 min</p>
      </div>
      <div class="tut-header-actions">
        <button class="icon-btn" title="Glossary" aria-label="Open glossary" onclick="openGlossary()"><span aria-hidden="true">&#128214;</span></button>
        <button class="icon-btn" title="Reset this phase" aria-label="Reset this phase" onclick="restart()"><span aria-hidden="true">&#8635;</span></button>
      </div>
    </div>
    <div class="phase-title" id="phaseTitle">Consolidation</div>

    <div id="beats"></div>
    <div id="mainGrid"></div>
    <div id="tail"></div>
    <div id="controls"></div>
  </div>
</div>

<div class="glossary-overlay" id="glossaryOverlay" onclick="if(event.target===this) dismissGlossary()">
  <div class="glossary-panel">
    <div class="glossary-panel-head">
      <div class="glossary-panel-title">Glossary</div>
      <button class="con-glossary-dismiss" aria-label="Dismiss" onclick="dismissGlossary()">&times;</button>
    </div>
    <div class="glossary-list" id="glossaryList"></div>
  </div>
</div>

<script src="shared.js"></script>
<script>
var step=0;
var TOTAL_STEPS=4;
var scenarioState={subsidiary:null,freddie:null,supplier:null};

var scenarios={
  subsidiary:{answer:'yes',correct:'Yes. Control makes this entity part of the presented family.',wrong:'Ownership at this level gives the parent control.'},
  freddie:{answer:'no',correct:'Right. Freddie could influence the shop, but he would not control it.',wrong:'A 30% interest can bring influence without control.'},
  supplier:{answer:'no',correct:'Right. Buying a lot from a supplier does not give you power to steer it.',wrong:'A close trading relationship is not control.'}
};

function nav(url){ window.location.href=url; }
function render(){
  renderBeats(step);
  renderMain(step);
  renderTail(step);
  renderControls(step);
}

function renderBeats(currentStep){
  var text='';
  if(currentStep===0){
    text='<p>In Module 5, you read CVS Health&rsquo;s real statements. The title line said <strong>Consolidated Balance Sheets</strong>.</p><p>We skipped past that first word on purpose. Now you have everything you need to read it.</p>';
  } else if(currentStep===1){
    text='<p>CVS Health is not one legal company. It is a parent and a large family of legally separate entities.</p><p>Module 2 gave you the entity concept: the wall around one body&rsquo;s books. <strong>Consolidation</strong> scales that idea up. When one entity controls another, the legal walls remain, but the statements present the family as <strong>one economic entity</strong>.</p>';
  } else if(currentStep===2){
    text='<p><strong>Control</strong> is the hinge. It means the power to steer the other entity.</p><p>Mark whether each relationship calls for consolidated statements.</p>';
  } else {
    text='<p>As an analyst, the word <strong>Consolidated</strong> tells you how wide the numbers reach. You are reading the whole controlled family, not one legal body at a time.</p>';
  }
  document.getElementById('beats').innerHTML='<div class="narrative-block">'+text+'</div><p class="con-progress">Reading '+(currentStep+1)+' of '+TOTAL_STEPS+'</p>';
}

function renderMain(currentStep){
  var html='';
  if(currentStep===0){
    html='<section class="con-stage" aria-labelledby="con-view-title"><div class="con-kicker">A word you already read</div><h2 id="con-view-title">The title line was telling you whose numbers you saw.</h2><div class="con-statement"><div class="con-company">CVS Health Corporation</div><div class="con-title-line">Consolidated Balance Sheets</div><div class="con-rule"></div></div></section>';
  } else if(currentStep===1){
    html='<section class="con-stage" aria-labelledby="con-view-title"><div class="con-kicker">One economic entity from many legal bodies</div><h2 id="con-view-title">Separate under law. Together in the statement.</h2><div class="con-family"><div class="con-family-label">One economic entity</div><div class="con-entity parent">Parent</div><div class="con-entity">Controlled entity</div><div class="con-entity">Controlled entity</div></div><div class="con-outside-note">Dealings inside the family cancel out. The statements show only the family&rsquo;s dealings with the outside world.</div></section>';
  } else if(currentStep===2){
    html='<section class="con-stage" aria-labelledby="con-view-title"><div class="con-kicker">Control is the hinge</div><h2 id="con-view-title">Consolidate, or not?</h2><div class="con-scenarios">'+
      scenarioHtml('subsidiary','An 80% owned subsidiary','The parent has the power to steer the entity.')+
      scenarioHtml('freddie','Freddie&rsquo;s proposed 30% of the bike shop','He would be an influential minority owner.')+
      scenarioHtml('supplier','A supplier you buy a lot from','The supplier remains independent.')+
      '</div></section>';
  } else {
    html='<section class="con-stage" aria-labelledby="con-view-title"><div class="con-kicker">Reading it as an analyst</div><h2 id="con-view-title">Three things the title line tells you</h2><div class="con-reading"><div class="con-reading-card"><strong>The numbers span the family.</strong>They cover the parent and every entity it controls.</div><div class="con-reading-card"><strong>The legal entities are invisible.</strong>The statement presents one economic entity.</div><div class="con-reading-card"><strong>Inside amounts are gone.</strong>Anything the family owed itself has canceled out.</div></div></section>';
  }
  document.getElementById('mainGrid').innerHTML=html;
}

function scenarioHtml(key,title,note){
  var state=scenarioState[key];
  var item=scenarios[key];
  var correct=state===item.answer;
  var feedback='';
  if(state) feedback=correct?item.correct:item.wrong;
  return '<div class="con-scenario'+(correct?' is-correct':'')+'" data-scenario="'+key+'"><div><div class="con-scenario-title">'+title+'</div><div class="con-scenario-note">'+note+'</div></div><div class="con-actions"><button class="con-choice'+(correct&&item.answer==='yes'?' correct':'')+'" onclick="chooseScenario(\''+key+'\',\'yes\',this)"'+(correct?' disabled':'')+'>Consolidate</button><button class="con-choice'+(correct&&item.answer==='no'?' correct':'')+'" onclick="chooseScenario(\''+key+'\',\'no\',this)"'+(correct?' disabled':'')+'>Do not consolidate</button></div><p class="con-feedback" aria-live="polite">'+feedback+'</p></div>';
}

function chooseScenario(key,choice,button){
  if(!scenarios[key]||scenarioState[key]===scenarios[key].answer)return;
  scenarioState[key]=choice;
  if(choice!==scenarios[key].answer){
    button.classList.remove('bounce');
    void button.offsetWidth;
    button.classList.add('bounce');
    var card=button.closest('.con-scenario');
    card.querySelector('.con-feedback').textContent=scenarios[key].wrong;
    return;
  }
  renderMain(step);
  renderControls(step);
}

function scenariosComplete(){
  return Object.keys(scenarios).every(function(key){ return scenarioState[key]===scenarios[key].answer; });
}

function renderTail(currentStep){
  var html='';
  if(currentStep===1){
    html='<div class="insight-box">Control redraws the reporting boundary around the family. The legal entities still exist; the statement simply shows their shared economics.</div>';
  } else if(currentStep===2&&!scenariosComplete()){
    html='<div class="insight-box">Influence, purchases, and control are different relationships. Consolidation turns on control.</div>';
  } else if(currentStep===2){
    html='<div class="insight-box">All three are set. Freddie&rsquo;s proposed share would bring influence, not control, so nobody would consolidate the bike shop into Freddie&rsquo;s books.</div>';
  } else if(currentStep===3){
    html='<div class="insight-box">That is all you need here. The mechanics belong to a later course. One page remains: the whole translation table, earned.</div>';
  }
  document.getElementById('tail').innerHTML=html;
}

function renderControls(currentStep){
  var html='<div class="nav-buttons">';
  if(currentStep===0){
    html+='<button class="btn-back" onclick="nav(\'94-3-Goodwill-The-Plug-with-a-Side.html\')">&larr; Back</button>';
  } else {
    html+='<button class="btn-back" onclick="back()">&larr; Back</button>';
  }
  if(currentStep<TOTAL_STEPS-1){
    var locked=currentStep===2&&!scenariosComplete();
    html+='<button class="btn-next" onclick="advance()"'+(locked?' disabled aria-disabled="true"':'')+'>Next &rarr;</button>';
  } else {
    html+='<button class="btn-continue" onclick="nav(\'96-1-Module-9-Complete.html\')">See the whole translation table &rarr;</button>';
  }
  html+='</div>';
  document.getElementById('controls').innerHTML=html;
}

function advance(){
  if(step===2&&!scenariosComplete())return;
  step=Math.min(step+1,TOTAL_STEPS-1);
  render();
  window.scrollTo(0,0);
}
function back(){
  step=Math.max(step-1,0);
  render();
  window.scrollTo(0,0);
}

var glossaryTerms=[
  {term:'Consolidation',def:'Presenting a parent and the entities it controls as one economic entity.'},
  {term:'Consolidated',def:'A title-line signal that the statement covers the whole controlled family.'},
  {term:'Control',def:'The power to steer another entity. Control is what triggers consolidation.'},
  {term:'Parent',def:'An entity that controls another entity.'},
  {term:'Subsidiary',def:'An entity controlled by a parent.'}
];
function openGlossary(){
  document.getElementById('glossaryList').innerHTML=glossaryTerms.map(function(item){
    return '<div class="glossary-entry"><div class="glossary-entry-term">'+item.term+'</div><div class="glossary-entry-def">'+item.def+'</div></div>';
  }).join('');
  document.getElementById('glossaryOverlay').classList.add('open');
}
function dismissGlossary(){ document.getElementById('glossaryOverlay').classList.remove('open'); }
function restart(){
  step=0;
  scenarioState={subsidiary:null,freddie:null,supplier:null};
  render();
  window.scrollTo(0,0);
}
document.addEventListener('keydown',function(event){ if(event.key==='Escape') dismissGlossary(); });
window.devFill=function(){
  scenarioState={subsidiary:'yes',freddie:'no',supplier:'no'};
  step=TOTAL_STEPS-1;
  render();
};
render();
</script>
<script src="dev.js"></script>
</body>
</html>
