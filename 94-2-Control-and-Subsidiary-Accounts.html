<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="color-scheme" content="light dark">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control and Subsidiary Accounts</title>
  <link rel="stylesheet" href="shared.css">
  <style>
    .m8-progress {
      margin:8px 0 0;
      color:#64748b;
      font:700 .72rem/1.3 Inter,sans-serif;
      letter-spacing:.08em;
      text-align:center;
      text-transform:uppercase;
    }
    .m8-stage { margin-top:16px; }
    #tail { margin-top:16px; }
    #controls { margin-top:18px; }
    .m8-card {
      max-width:850px;
      margin:0 auto;
      border:1px solid #cbd5e1;
      border-radius:10px;
      background:#fff;
      box-shadow:0 7px 20px rgba(32,55,72,.08);
      overflow:hidden;
    }
    .m8-card-head {
      margin:0;
      padding:15px 18px;
      background:#eaf1f8;
      color:#16324a;
      font:800 1rem/1.35 Inter,sans-serif;
    }
    .m8-card-body { padding:18px; }
    .m8-control-stack {
      position:relative;
      max-width:620px;
      min-height:190px;
      margin:0 auto;
      padding-top:58px;
    }
    .m8-ledger-page {
      position:absolute;
      left:50%;
      width:76%;
      height:82px;
      border:1px solid #b8c4d1;
      border-radius:8px;
      background:#f8fafc;
      transform:translateX(-50%);
    }
    .m8-ledger-page:nth-child(1) { top:0; width:62%; opacity:.5; }
    .m8-ledger-page:nth-child(2) { top:14px; width:69%; opacity:.72; }
    .m8-ledger-page:nth-child(3) { top:28px; }
    .m8-control-line {
      position:relative;
      z-index:2;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      min-height:68px;
      border:2px solid #286dc0;
      border-radius:8px;
      padding:14px 18px;
      background:#fff;
      color:#16324a;
      font:800 1.02rem/1.35 Inter,sans-serif;
      box-shadow:0 5px 14px rgba(40,109,192,.13);
    }
    .m8-amount { font-family:"JetBrains Mono",monospace; font-variant-numeric:tabular-nums; }
    .m8-stack-caption {
      position:relative;
      z-index:2;
      margin:14px 0 0;
      color:#475569;
      font:600 .9rem/1.5 "Open Sans",sans-serif;
      text-align:center;
    }
    .m8-detail-grid {
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      gap:16px;
      max-width:850px;
      margin:0 auto;
    }
    .m8-detail-grid > * { min-width:0; }
    .m8-detail-panel {
      border:1px solid #cbd5e1;
      border-radius:10px;
      padding:16px;
      background:#fff;
      box-shadow:0 7px 20px rgba(32,55,72,.08);
    }
    .m8-detail-label {
      margin:0 0 13px;
      color:#64748b;
      font:800 .72rem/1.3 Inter,sans-serif;
      letter-spacing:.08em;
      text-transform:uppercase;
    }
    .m8-subledger {
      overflow:hidden;
      border:1px solid #cbd5e1;
      border-radius:7px;
    }
    .m8-subledger-head,
    .m8-subledger-row,
    .m8-subledger-total {
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:12px;
      padding:10px 12px;
    }
    .m8-subledger-head { background:#f0f4f8; color:#64748b; font:700 .76rem/1.3 Inter,sans-serif; text-transform:uppercase; }
    .m8-subledger-row { border-top:1px solid #e2e8f0; font:700 .91rem/1.4 "Open Sans",sans-serif; }
    .m8-subledger-total { border-top:1px solid #64748b; color:#16324a; font:800 .91rem/1.4 Inter,sans-serif; }
    .m8-fan {
      display:grid;
      grid-template-columns:minmax(120px,1fr) 34px minmax(140px,1fr);
      align-items:center;
      gap:8px;
      max-width:680px;
      margin:0 auto;
    }
    .m8-fan-line,
    .m8-fan-detail {
      border:1px solid #86a9ce;
      border-radius:8px;
      padding:14px;
      background:#f1f7fd;
      color:#16324a;
      font:800 .92rem/1.35 Inter,sans-serif;
      text-align:center;
    }
    .m8-fan-arrow { color:#286dc0; font:800 1.5rem/1 Inter,sans-serif; text-align:center; }
    .m8-choice-card { max-width:850px; margin:0 auto; }
    .m8-choice-intro { margin:0 0 14px; color:#475569; font:600 .92rem/1.5 "Open Sans",sans-serif; }
    .m8-choice-row {
      display:grid;
      grid-template-columns:minmax(200px,1fr) 136px 136px;
      gap:10px;
      align-items:center;
      padding:13px 0;
      border-top:1px solid #e2e8f0;
    }
    .m8-choice-row.is-correct { color:#166534; }
    .m8-choice-prompt { font:700 .94rem/1.4 Inter,sans-serif; }
    .m8-choice {
      min-height:42px;
      border:1px solid #8ca3ba;
      border-radius:999px;
      padding:8px 12px;
      background:#fff;
      color:#16324a;
      cursor:pointer;
      font:800 .8rem/1.2 Inter,sans-serif;
    }
    .m8-choice:hover:not(:disabled), .m8-choice:focus-visible { border-color:#286dc0; background:#eef6ff; }
    .m8-choice:disabled { cursor:default; opacity:.55; }
    .m8-choice.is-answer { border-color:#28864f; background:#ecfdf3; color:#166534; opacity:1; }
    .m8-choice.is-wrong { border-color:#c45b3d; background:#fff1ed; color:#8f301a; }
    .m8-choice-feedback {
      grid-column:2 / 4;
      min-height:0;
      margin:0;
      color:#a63b20;
      font:600 .84rem/1.4 "Open Sans",sans-serif;
    }
    .m8-choice-row.is-correct .m8-choice-feedback { color:#166534; }
    .m8-choice.is-bouncing { animation:m8-bounce .32s ease; }
    @keyframes m8-bounce {
      0%,100% { transform:translateX(0); }
      30% { transform:translateX(-6px); }
      65% { transform:translateX(5px); }
    }
    .m8-outsider-grid {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:12px;
      margin:0;
      padding:0;
      list-style:none;
    }
    .m8-outsider-grid li {
      border-left:4px solid #286dc0;
      border-radius:4px;
      padding:14px;
      background:#f8fafc;
      color:#334155;
      font:600 .91rem/1.48 "Open Sans",sans-serif;
    }
    .m8-glossary-dismiss {
      border:0;
      padding:2px 7px;
      background:transparent;
      color:inherit;
      cursor:pointer;
      font-size:1.7rem;
      line-height:1;
    }
    @media (max-width:720px) {
      .m8-detail-grid, .m8-outsider-grid { grid-template-columns:1fr; }
      .m8-choice-row { grid-template-columns:1fr 1fr; }
      .m8-choice-prompt { grid-column:1 / 3; }
      .m8-choice-feedback { grid-column:1 / 3; }
    }
    @media (max-width:480px) {
      .m8-fan { grid-template-columns:1fr; }
      .m8-fan-arrow { transform:rotate(90deg); }
      .m8-choice-row { grid-template-columns:1fr; }
      .m8-choice-prompt, .m8-choice-feedback { grid-column:1; }
    }
    @media (prefers-color-scheme:dark) {
      .m8-progress, .m8-stack-caption, .m8-choice-intro { color:#aebbd0; }
      .m8-card, .m8-detail-panel { border-color:#4b5567; background:#26242e; box-shadow:0 7px 20px rgba(0,0,0,.28); }
      .m8-card-head { background:#302e39; color:#e7eef9; }
      .m8-ledger-page { border-color:#4b5567; background:#211f28; }
      .m8-control-line { border-color:#6da5e5; background:#26242e; color:#e7eef9; box-shadow:0 5px 14px rgba(0,0,0,.25); }
      .m8-detail-label { color:#aebbd0; }
      .m8-subledger { border-color:#4b5567; }
      .m8-subledger-head { background:#302e39; color:#aebbd0; }
      .m8-subledger-row { border-color:#4b5567; }
      .m8-subledger-total { border-color:#8996aa; color:#e7eef9; }
      .m8-fan-line, .m8-fan-detail { border-color:#587fa8; background:#222d3a; color:#e7eef9; }
      .m8-choice-row { border-color:#4b5567; }
      .m8-choice { border-color:#77849a; background:#211f28; color:#e7eef9; }
      .m8-choice:hover:not(:disabled), .m8-choice:focus-visible { border-color:#6da5e5; background:#26384b; }
      .m8-choice.is-answer { border-color:#4e966a; background:#183425; color:#b6f0c8; }
      .m8-choice.is-wrong { border-color:#b86851; background:#43251d; color:#ffb19d; }
      .m8-choice-feedback { color:#ffb19d; }
      .m8-choice-row.is-correct, .m8-choice-row.is-correct .m8-choice-feedback { color:#b6f0c8; }
      .m8-outsider-grid li { background:#211f28; color:#dce6f4; }
    }
    @media (prefers-reduced-motion:reduce) {
      .m8-choice.is-bouncing { animation:none; }
    }
  </style>
</head>
<body>
<div class="page">
  <div class="prework-wrap">
    <div class="tut-header">
      <div class="tut-header-main">
        <h1>Control and Subsidiary Accounts</h1>
        <p class="tut-header-sub">Module 9 &middot; ~4 min</p>
      </div>
      <div class="tut-header-actions">
        <button class="icon-btn" title="Glossary" aria-label="Open glossary" onclick="openGlossary()"><span aria-hidden="true">?</span></button>
        <button class="icon-btn" title="Reset this phase" aria-label="Reset this phase" onclick="restart()"><span aria-hidden="true">&#8635;</span></button>
      </div>
    </div>
    <div class="phase-title" id="phaseTitle">Control and Subsidiary Accounts</div>

    <div id="beats"></div>
    <div class="m8-stage" id="mainGrid"></div>
    <div id="tail"></div>
    <div id="controls"></div>
    <!-- Canon anchor: 300. The visible amount is rendered from M8_DATA. -->
  </div>
</div>

<div class="glossary-overlay" id="glossaryOverlay" onclick="if(event.target===this) dismissGlossary()">
  <div class="glossary-panel">
    <div class="glossary-panel-head">
      <div class="glossary-panel-title">Glossary</div>
      <button class="m8-glossary-dismiss" aria-label="Dismiss" onclick="dismissGlossary()">&times;</button>
    </div>
    <div class="glossary-list" id="glossaryList"></div>
  </div>
</div>

<script src="m8-data.js"></script>
<script src="toolkit-lab.js"></script>
<script src="shared.js"></script>
<script>
var step=0;
var TOTAL_STEPS=4;
var data=window.M8_DATA;

function findEntry(entries,id){
  return entries.filter(function(entry){ return entry.id===id; })[0];
}
function findLine(entry,account,side){
  return entry.lines.filter(function(line){ return line.acct===account&&(!side||line.side===side); })[0];
}
function comma(value){
  return Number(value).toLocaleString('en-US');
}

var ridgeEntry=findEntry(data.seasonEntries,'ridge');
var receivablesAmount=findLine(ridgeEntry,'Receivables','dr').amt;
var revenueAmount=data.incomeStatement.revenue;
var choices={
  total:{answer:'control',selected:'',feedback:{
    control:'Correct. The total belongs in the control account.',
    subsidiary:'That asks for the total, not a named customer.'
  }},
  ridge:{answer:'subsidiary',selected:'',feedback:{
    control:'The control account gives the total, not Ridgeline&rsquo;s detail.',
    subsidiary:'Correct. A named customer belongs in the subsidiary ledger.'
  }},
  revenue:{answer:'control',selected:'',feedback:{
    control:'Correct. The season total belongs on the control side.',
    subsidiary:'The repair names explain the total; the total itself is control-side.'
  }}
};
var lastWrong={key:'',side:''};

function render(){
  renderBeats(step);
  renderMain(step);
  renderTail(step);
  renderControls(step);
  wireChoices();
}

function renderBeats(currentStep){
  var text='';
  if(currentStep===0){
    text='The statements show Receivables '+comma(receivablesAmount)+' &mdash; one line. Behind that one line, insiders keep a small account for each customer. The general-ledger line is the <strong>control account</strong>. The per-customer accounts form the <strong>subsidiary ledger</strong>. The subsidiary ledger always sums to the control account.';
  } else if(currentStep===1){
    text='You have already seen this structure. Module 1&rsquo;s notebook kept each customer&rsquo;s promise by name. Module 7 hid nineteen named repairs behind one Repair Revenue arrow. Those fans were subsidiary detail.';
  } else if(currentStep===2){
    text='Why split the books? Volume and answerability. The general ledger stays readable. The subsidiary ledger answers, &ldquo;Who owes us what?&rdquo; Mark each question as control-side or subsidiary-side.';
  } else {
    text='As an analyst, you usually receive control balances only. The names are the insiders&rsquo;. When a footnote or an aging table appears, you are seeing a curated glimpse of a subsidiary ledger.';
  }
  document.getElementById('beats').innerHTML='<div class="narrative-block"><p>'+text+'</p></div><p class="m8-progress">Reading '+(currentStep+1)+' of '+TOTAL_STEPS+'</p>';
}

function renderMain(currentStep){
  var el=document.getElementById('mainGrid');
  if(currentStep===0){
    el.innerHTML='<section class="m8-card" aria-labelledby="one-line-title"><h2 class="m8-card-head" id="one-line-title">One line, a book of names behind it</h2><div class="m8-card-body">'+
      '<div class="m8-control-stack"><div class="m8-ledger-page" aria-hidden="true"></div><div class="m8-ledger-page" aria-hidden="true"></div><div class="m8-ledger-page" aria-hidden="true"></div>'+
      '<div class="m8-control-line"><span>Receivables</span><span class="m8-amount">'+comma(receivablesAmount)+'</span></div><p class="m8-stack-caption">Control account in front. Customer detail behind it.</p></div></div></section>';
  } else if(currentStep===1){
    el.innerHTML='<div class="m8-detail-grid"><section class="m8-detail-panel" aria-labelledby="control-title"><h2 class="m8-detail-label" id="control-title">General ledger &middot; control</h2><div id="receivablesT"></div></section>'+
      '<section class="m8-detail-panel" aria-labelledby="subsidiary-title"><h2 class="m8-detail-label" id="subsidiary-title">Subsidiary ledger &middot; customer detail</h2><div class="m8-subledger"><div class="m8-subledger-head"><span>Customer</span><span>Owes</span></div><div class="m8-subledger-row"><span>Ridgeline Cyclery</span><span class="m8-amount">'+comma(receivablesAmount)+'</span></div><div class="m8-subledger-total"><span>Total</span><span class="m8-amount">'+comma(receivablesAmount)+'</span></div></div></section></div>';
    ToolkitLab.renderTAccount(document.getElementById('receivablesT'),{
      name:'Receivables',
      rows:[{side:'debit',label:ridgeEntry.narration,amt:receivablesAmount}]
    },{showBalance:true});
  } else if(currentStep===2){
    el.innerHTML='<section class="m8-card m8-choice-card" aria-labelledby="sort-title"><h2 class="m8-card-head" id="sort-title">Which side answers the question?</h2><div class="m8-card-body"><p class="m8-choice-intro">Choose the smallest ledger view that answers each question.</p><div id="choiceRows"></div></div></section>';
  } else {
    el.innerHTML='<section class="m8-card" aria-labelledby="analyst-title"><h2 class="m8-card-head" id="analyst-title">What reaches an outsider</h2><div class="m8-card-body"><ul class="m8-outsider-grid"><li>The financial statements report the control balance.</li><li>A footnote may summarize selected detail behind that balance.</li><li>An aging table groups customer balances without handing over the full ledger.</li></ul></div></section>';
  }
}

function choiceRow(key,prompt){
  var item=choices[key];
  var correct=item.selected===item.answer;
  var feedback=item.selected?item.feedback[item.selected]:'';
  return '<div class="m8-choice-row'+(correct?' is-correct':'')+'" data-choice-row="'+key+'"><div class="m8-choice-prompt">'+prompt+'</div>'+
    choiceButton(key,'control','Control-side',correct)+choiceButton(key,'subsidiary','Subsidiary-side',correct)+
    '<p class="m8-choice-feedback" aria-live="polite">'+feedback+'</p></div>';
}
function choiceButton(key,side,label,locked){
  var item=choices[key];
  var classes='m8-choice';
  if(item.selected===side&&item.answer===side) classes+=' is-answer';
  if(item.selected===side&&item.answer!==side) classes+=' is-wrong';
  return '<button class="'+classes+'" data-choice-key="'+key+'" data-choice-side="'+side+'"'+(locked?' disabled':'')+'>'+label+'</button>';
}
function renderChoiceRows(){
  var rows=document.getElementById('choiceRows');
  if(!rows) return;
  rows.innerHTML=choiceRow('total','Total owed by customers')+
    choiceRow('ridge','What does Ridgeline owe?')+
    choiceRow('revenue','Did the season&rsquo;s revenue reach '+comma(revenueAmount)+'?');
}

function renderTail(currentStep){
  var html='';
  if(currentStep===1){
    html='<section class="m8-card" aria-labelledby="fan-title"><h2 class="m8-card-head" id="fan-title">The richer example</h2><div class="m8-card-body"><div class="m8-fan"><div class="m8-fan-line">Repair Revenue<br>one line</div><div class="m8-fan-arrow" aria-hidden="true">&#8594;</div><div class="m8-fan-detail">nineteen named repairs<br>subsidiary detail</div></div></div></section>';
  } else if(currentStep===3){
    html='<div class="insight-box">Sometimes one line hides detail. Sometimes one line hides a <strong>plug</strong> &mdash; and the plug has a name. That is next.</div>';
  }
  document.getElementById('tail').innerHTML=html;
  if(currentStep===2) renderChoiceRows();
}

function renderControls(currentStep){
  var html='<div class="nav-buttons">';
  if(currentStep===0){
    html+='<button class="btn-back" onclick="playClick();nav(\'94-1-Contra-and-Adjunct-Accounts.html\')">&larr; Back</button>';
  } else {
    html+='<button class="btn-back" onclick="back()">&larr; Back</button>';
  }
  if(currentStep<TOTAL_STEPS-1){
    var locked=currentStep===2&&!choicesComplete();
    html+='<button class="btn-next" onclick="advance()"'+(locked?' disabled aria-disabled="true"':'')+'>Next &rarr;</button>';
  } else {
    html+='<button class="btn-continue" onclick="playSuccess();nav(\'94-3-Goodwill-The-Plug-with-a-Side.html\')">Goodwill: The Plug with a Side &rarr;</button>';
  }
  html+='</div>';
  document.getElementById('controls').innerHTML=html;
}

function wireChoices(){
  if(step!==2) return;
  renderChoiceRows();
  document.querySelectorAll('[data-choice-key]').forEach(function(button){
    button.addEventListener('click',function(){
      choose(this.getAttribute('data-choice-key'),this.getAttribute('data-choice-side'));
    });
  });
  if(lastWrong.key){
    var wrong=document.querySelector('[data-choice-key="'+lastWrong.key+'"][data-choice-side="'+lastWrong.side+'"]');
    if(wrong){
      wrong.classList.add('is-bouncing');
      setTimeout(function(){ wrong.classList.remove('is-bouncing'); },360);
    }
    lastWrong={key:'',side:''};
  }
}
function choose(key,side){
  var item=choices[key];
  if(!item||item.selected===item.answer) return;
  item.selected=side;
  if(side===item.answer){
    playSuccess();
  } else {
    lastWrong={key:key,side:side};
    playNope();
  }
  renderControls(step);
  wireChoices();
}
function choicesComplete(){
  return Object.keys(choices).every(function(key){ return choices[key].selected===choices[key].answer; });
}
function advance(){
  if(step===2&&!choicesComplete()) return;
  playClick();
  step=Math.min(step+1,TOTAL_STEPS-1);
  render();
  window.scrollTo(0,0);
}
function back(){
  playClick();
  step=Math.max(step-1,0);
  render();
  window.scrollTo(0,0);
}

var audioCtx=null;
function ac(){
  if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  return audioCtx;
}
function tone(f,d,t,v){
  var c=ac();
  if(!c) return;
  var o=c.createOscillator(),g=c.createGain();
  o.type=t||'sine';
  o.frequency.value=f;
  o.connect(g);
  g.connect(c.destination);
  g.gain.setValueAtTime(v||0.05,c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.0001,c.currentTime+d);
  o.start();
  o.stop(c.currentTime+d);
}
function playSuccess(){ tone(523,0.12); setTimeout(function(){ tone(659,0.12); },90); setTimeout(function(){ tone(784,0.16); },180); }
function playClick(){ tone(600,0.08,'sine',0.04); }
function playNope(){ tone(220,0.12,'sine',0.035); }
function nav(url){ window.location.href=url; }

var glossaryTerms=[
  {term:'Control account',def:'The general-ledger account that reports one total for a group of detailed accounts.'},
  {term:'Subsidiary ledger',def:'The collection of detailed accounts behind a control account, such as one Receivables account for each customer.'},
  {term:'General ledger',def:'The main collection of accounts used to prepare the financial statements.'},
  {term:'Aging table',def:'A report that groups customer balances by how long they have been unpaid.'},
  {term:'Plug',def:'An amount that makes a larger accounting structure tie. The next page gives the purchase-price plug its professional name.'}
];
function openGlossary(){
  document.getElementById('glossaryList').innerHTML=glossaryTerms.map(function(item){
    return '<div class="glossary-entry"><div class="glossary-entry-term">'+item.term+'</div><div class="glossary-entry-def">'+item.def+'</div></div>';
  }).join('');
  document.getElementById('glossaryOverlay').classList.add('open');
}
function dismissGlossary(){ document.getElementById('glossaryOverlay').classList.remove('open'); }
function restart(){
  playClick();
  step=0;
  Object.keys(choices).forEach(function(key){ choices[key].selected=''; });
  lastWrong={key:'',side:''};
  render();
  window.scrollTo(0,0);
}
document.addEventListener('keydown',function(event){ if(event.key==='Escape') dismissGlossary(); });
window.devFill=function(){
  Object.keys(choices).forEach(function(key){ choices[key].selected=choices[key].answer; });
  step=TOTAL_STEPS-1;
  render();
};
render();
</script>
<script src="dev.js"></script>
</body>
</html>
